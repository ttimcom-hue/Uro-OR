<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>泌尿科刀房調度板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: clinical, calm, exact — a chief resident's tool used every afternoon
   IDEA: the OR control-desk whiteboard: rooms as lanes, the 16:00 line drawn in red
   PICTURE: live Gantt of every room with 16:00 / 17:30 / 18:00 lines, cases as coloured blocks
   COLOUR and TYPE: white ground, scrub teal #0b5563 band, coral red for overtime; Noto Sans TC + Figtree figures
   LAYOUT: band header → summary → Gantt → advice + rooms → staffing → LINE text; settings in tabs */
:root{color-scheme:light dark;--bg:light-dark(#f4f7f7,#0b1315);--card:light-dark(#fff,#121e21);--ink:light-dark(#0f262b,#e2edee);--mut:light-dark(#587076,#8ea6aa);--line:light-dark(#d8e2e3,#24363a);--scrub:light-dark(#0b5563,#0e6474);--soft:light-dark(#e4f0f1,#15313a);--red:#e5484d;--redbg:light-dark(#fdecec,#3a1a1c);--amb:#c77d00;--ambbg:light-dark(#fff4dc,#3a2c10);--ok:#1f8a5b;--okbg:light-dark(#e6f5ee,#123227)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
.num,.t{font-family:Figtree,"Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
header{background:var(--scrub);color:#fff;padding:18px max(4vw,14px) 0}
.hrow{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;max-width:1320px;margin:auto}
h1{font:800 clamp(24px,3.4vw,36px)/1.05 Figtree,"Noto Sans TC",sans-serif;margin:0;letter-spacing:.01em}
.sub{opacity:.85;font-size:14px}
.datebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.datebox input,.datebox select{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:8px 10px;font:16px Figtree,sans-serif;min-height:44px}
.datebox select option{color:#000}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:4px;max-width:1320px;margin:14px auto 0;overflow-x:auto}
.tabs button{background:transparent;color:#fff;border:0;border-radius:10px 10px 0 0;padding:11px 18px;font:500 15px "Noto Sans TC",sans-serif;min-height:44px;cursor:pointer;opacity:.8;flex:none}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink);opacity:1;font-weight:700}
main{max-width:1320px;margin:auto;padding:18px max(4vw,14px) 60px}
section{margin-bottom:22px}
h2{font:700 19px/1.3 "Noto Sans TC",sans-serif;margin:0 0 10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h2 small{font-weight:400;color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font:800 26px/1.1 Figtree,sans-serif}
.kpi span{color:var(--mut);font-size:13px}
.kpi.bad{border-color:var(--red);background:var(--redbg)}.kpi.warn{border-color:var(--amb);background:var(--ambbg)}.kpi.ok{border-color:var(--ok);background:var(--okbg)}
.scroll{overflow-x:auto}
.gantt{min-width:760px;padding:6px 0 2px}
.grow{display:grid;grid-template-columns:150px 1fr 64px;align-items:center;min-height:46px;border-bottom:1px solid var(--line)}
.glab{padding-right:8px;font-size:13px;line-height:1.25}.glab b{font:800 17px Figtree,sans-serif;display:block}
.gtrack{position:relative;height:36px}
.gend{text-align:right;font:700 14px Figtree,sans-serif}
.gend.bad{color:var(--red)}.gend.warn{color:var(--amb)}
.vl{position:absolute;top:-6px;bottom:-6px;border-left:1px solid var(--line);pointer-events:none}
.vl.dl{border-left:2px solid var(--red)}.vl.ot{border-left:2px dashed var(--amb)}.vl.dv{border-left:2px dotted var(--red)}.vl.md{border-left:1px dashed var(--mut);opacity:.6}
.ticks{position:relative;height:20px;font:12px Figtree,sans-serif;color:var(--mut)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.bar{position:absolute;top:4px;bottom:4px;border-radius:6px;color:#fff;font-size:12px;line-height:28px;padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.bar.late{outline:2px solid var(--red);outline-offset:1px}
.bar.top::before{content:"★ "}
.c-minor{background:#6f9bb6}.c-urs{background:#2f7fb5}.c-tur{background:#4f5bd5}.c-laser{background:#8c45b8}.c-pcnl{background:#c4621d}.c-lap{background:#0f8b8d}.c-robot{background:#c2185b}.c-sp{background:#e04f8a}.c-open{background:#5f7224}.c-bx{background:#9c7a12}.c-eswl{background:#6b6b6b}.c-tx{background:#8a3b3b}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.adv{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.adv li{border-radius:10px;padding:10px 12px;border-left:5px solid var(--mut);background:var(--soft)}
.adv li.bad{border-color:var(--red);background:var(--redbg)}.adv li.warn{border-color:var(--amb);background:var(--ambbg)}.adv li.ok{border-color:var(--ok);background:var(--okbg)}
.adv b{display:block}.adv p{margin:3px 0 0;font-size:13.5px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.room h3{margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:16px}
.room h3 .rn{font:800 22px Figtree,sans-serif}
.cases{list-style:none;margin:0;padding:0}
.case{display:grid;grid-template-columns:88px minmax(0,1fr);gap:4px 8px;padding:8px 0;border-top:1px solid var(--line)}
.case .t{font-weight:700;font-size:13px}
.case .pn{font-size:13px;color:var(--mut);overflow-wrap:anywhere}
.case .cx{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.case.late .t{color:var(--red)}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--soft);margin-left:4px;white-space:nowrap}
.chip.r{background:var(--redbg);color:var(--red)}.chip.a{background:var(--ambbg);color:var(--amb)}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 12px;min-height:40px;cursor:pointer}
.btn.p{background:var(--scrub);border-color:var(--scrub);color:#fff;font-weight:700}
.btn.s{padding:4px 9px;min-height:34px;min-width:34px;font-size:13px}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #3aa0b4;outline-offset:1px}
select,input[type=text],input[type=number],input[type=time],textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:16px;min-height:38px}
input[type=number]{width:74px;text-align:right}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.drop{border:2px dashed var(--line);border-radius:14px;padding:16px;text-align:center;background:var(--card)}
.drop.on{border-color:var(--scrub);background:var(--soft)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:middle;font-size:14px}
th{font-size:12.5px;color:var(--mut);font-weight:500;white-space:nowrap}
.res td select{min-width:92px}
.as{font-weight:700;white-space:nowrap}.as.bad{color:var(--red)}.as.warn{color:var(--amb)}
.ab select{min-width:64px;font-size:14px;padding:4px}
.ab0{background:light-dark(#f1f1f1,#222)!important}.ab1{background:light-dark(#fff6d9,#3a3010)!important}.ab2{background:light-dark(#dff0fb,#123047)!important}.ab3{background:light-dark(#d9f3e5,#113524)!important}
textarea.line{width:100%;min-height:300px;font:15px/1.5 "Noto Sans TC",monospace}
.note{font-size:13px;color:var(--mut)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs img{height:70px;border-radius:6px;border:1px solid var(--line)}
details summary{cursor:pointer;font-weight:700;min-height:36px;display:flex;align-items:center}
.sync{font-size:12px;opacity:.9}
@media(max-width:600px){.grow{grid-template-columns:96px 1fr 52px}.case{grid-template-columns:76px minmax(0,1fr)}table{font-size:13px}}

.grip{cursor:grab;touch-action:none;user-select:none;display:inline-block;padding:2px 6px 2px 0;font-size:16px;color:var(--mut)}
.case.fixed{background:linear-gradient(90deg,var(--soft),transparent 60%)}
.case.dragging{opacity:.35}.case.dropb{box-shadow:inset 0 3px 0 var(--scrub)}.cases.dropend{box-shadow:inset 0 -3px 0 var(--scrub)}
.ghost{position:fixed;z-index:50;pointer-events:none;background:var(--card);border:2px solid var(--scrub);border-radius:10px;padding:6px 10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:280px}
.gapn{grid-column:1/-1;font-size:12px;color:var(--amb)}
.tg.on{background:var(--scrub);color:#fff;border-color:var(--scrub)}
input.man{border-color:var(--scrub);border-width:2px}
.dcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}.dh{text-align:center;font-size:12px;color:var(--mut)}
.dcell{border:1px solid var(--line);border-radius:8px;padding:4px;min-height:74px;font-size:12px;display:flex;flex-direction:column;gap:2px}.dcell.we{background:var(--soft)}.dcell.today{outline:2px solid var(--scrub)}
.dcell .btn.s{min-height:26px;padding:1px 6px;font-size:12px;margin:1px}.dcell select{min-height:26px;font-size:12px;padding:0 2px;margin-top:auto}
.bar{cursor:grab;touch-action:none}.bar.fixed{cursor:default;opacity:.92}.bar.fbad{outline:2px solid var(--red);outline-offset:1px}.bar.fwarn{outline:2px dashed var(--amb);outline-offset:1px}.bar .tag{font-style:normal;background:rgba(0,0,0,.35);border-radius:4px;padding:0 4px;margin-right:3px;font-size:11px}
.bar.flash,.case.flash{animation:fl 1.2s 2}@keyframes fl{50%{box-shadow:0 0 0 4px #ffd54a}}
.glab .rs{display:block;font-size:11.5px;color:var(--mut)}.gsep{font-size:12px;color:var(--mut);padding:8px 0 2px;border-bottom:1px solid var(--line)}
.eqrow{min-height:30px}.eqrow .gtrack{height:22px}.eqn{font:700 12.5px "Noto Sans TC",sans-serif!important}.eqb{position:absolute;top:2px;bottom:2px;border-radius:4px;background:var(--scrub);color:#fff;font-size:11px;line-height:18px;padding:0 4px;overflow:hidden;white-space:nowrap;opacity:.85}.eqb.over{background:var(--red);opacity:1}
.gtrack.droprow{background:var(--soft)}.dropline{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--scrub);border-radius:2px;pointer-events:none}
.advt{all:unset;cursor:pointer;font-weight:700;display:block}.advt:focus-visible{outline:2px solid #3aa0b4}.adv p{margin:2px 0 4px;font-size:13px}
.bar .ord{display:inline-block;min-width:15px;text-align:center;background:rgba(255,255,255,.9);color:#123;border-radius:50%;font:700 10.5px/15px Figtree,sans-serif;margin-right:4px}.bar.sel{box-shadow:0 0 0 3px #ffd54a;z-index:2}
.glab .gsort{min-height:24px;padding:0 6px;font-size:11.5px;margin-left:4px;vertical-align:2px}.glab .ss{display:block;font-size:12px}
.selp{margin-top:12px;border:2px solid var(--scrub);border-radius:12px;padding:10px 12px;background:var(--soft)}.selp.late{border-color:var(--red)}.selhint{margin:10px 0 0}
.evechips{display:flex;flex-wrap:wrap;gap:4px;padding:4px 0}
.vgrid{display:grid;min-width:max-content;position:relative}.vh{position:sticky;top:0;z-index:3;background:var(--card);border-bottom:2px solid var(--line);padding:6px 6px 4px;font-size:12.5px;line-height:1.3}.vh .rn{font:800 18px Figtree,sans-serif}.vh .ss{font-weight:700}.vh .rs{color:var(--mut)}.vh .gsort{min-height:26px;margin-top:3px;font-size:12px}.veh{writing-mode:vertical-rl;font-size:11.5px;padding:4px 2px;text-align:start;color:var(--mut)}
.vtime{position:relative;border-right:1px solid var(--line)}.vtime span{position:absolute;right:4px;transform:translateY(-50%);font:12px Figtree,sans-serif;color:var(--mut)}
.vcol{position:relative;border-right:1px solid var(--line);background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px)}.veq{background-color:var(--soft)}
.hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none;z-index:1}.hl.dl{border-top:2px solid var(--red)}.hl.ot{border-top:2px dashed var(--amb)}.hl.dv{border-top:2px dotted var(--red)}.hl.md{border-top:1px dashed var(--mut);opacity:.6}
.vb{position:absolute;left:3px;right:3px;z-index:2;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--cc,#888);border-radius:7px;padding:3px 6px;overflow:hidden;font-size:13px;line-height:1.3;cursor:grab;touch-action:none;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.vb.fixed{cursor:pointer}.vb.sel{box-shadow:0 0 0 3px #ffd54a;z-index:4}.vb.late{background:var(--redbg)}.vb.fbad{outline:2px solid var(--red)}.vb.fwarn{outline:2px dashed var(--amb)}
.vb .vbh{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vb .t{font:700 12.5px Figtree,sans-serif}.vb .vbp{color:var(--ink);opacity:.85;overflow-wrap:anywhere}.vb .vbt{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}
.vb .ord{display:inline-block;min-width:17px;text-align:center;background:var(--cc,#888);color:#fff;border-radius:50%;font:700 11px/17px Figtree,sans-serif;margin-right:4px}
.vb.tiny{padding:1px 6px;font-size:12px}.vb.tiny .vbp,.vb.tiny .vbt{display:none}
.tag{font-style:normal;border-radius:4px;padding:0 5px;font-size:11px;white-space:nowrap}.tag.n{background:var(--soft)}.tag.a{background:var(--ambbg);color:var(--amb)}.tag.r{background:var(--redbg);color:var(--red)}
.vb.c-minor{--cc:#6f9bb6}.vb.c-urs{--cc:#2f7fb5}.vb.c-tur{--cc:#4f5bd5}.vb.c-laser{--cc:#8c45b8}.vb.c-pcnl{--cc:#c4621d}.vb.c-lap{--cc:#0f8b8d}.vb.c-robot{--cc:#c2185b}.vb.c-sp{--cc:#e04f8a}.vb.c-open{--cc:#5f7224}.vb.c-bx{--cc:#9c7a12}.vb.c-eswl{--cc:#6b6b6b}.vb.c-tx{--cc:#8a3b3b}
.vb.c-minor,.vb.c-urs,.vb.c-tur,.vb.c-laser,.vb.c-pcnl,.vb.c-lap,.vb.c-robot,.vb.c-sp,.vb.c-open,.vb.c-bx,.vb.c-eswl,.vb.c-tx{background-color:var(--card)}.vb.late{background-color:var(--redbg)}
.eqv{position:absolute;left:2px;right:2px;border-radius:4px;background:var(--scrub);color:#fff;font-size:10.5px;text-align:center;overflow:hidden;z-index:2;opacity:.85}.eqv.over{background:var(--red);opacity:1}
.dropline.h{left:0;right:0;width:auto;height:3px;top:0;bottom:auto}
.selp{position:sticky;bottom:8px;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.18);background:var(--card)}
@media(prefers-reduced-motion:no-preference){.bar{transition:left .25s,width .25s}}
</style>

<script>
{

function defaultCfg(){const c={v:11,
set:{start:'08:30',amEnd:'12:30',turn:15,deadline:'16:00',nurseOT:'17:30',dvBlock:'18:00',opdam:1,opdpm:1,longCase:180,sdStart:'13:00',pmStart:'13:00',postCall:true,opdTol:15,robotTF:'13:00'},

async function gsGet(key){if(GAS){const v=await gasCall('apiGet',key);return v?JSON.parse(v):null}const r=await fetch(gs.url+(gs.url.includes('?')?'&':'?')+'key='+encodeURIComponent(key)+'&token='+encodeURIComponent(gs.token));const j=await r.json();if(!j.ok)throw new Error(j.err||'fail');return j.value}
async function gsSet(key,value){if(GAS){await gasCall('apiSet',key,JSON.stringify(value));return}const r=await fetch(gs.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:gs.token,key,value})});const j=await r.json();if(!j.ok)throw new Error(j.err||'fail')}
async function gsFlush(path,obj){if(writing[path]){writing[path].next=obj;return}writing[path]={};try{await gsSet(path,obj);syncState='gs'}catch(e){syncState='err'}const nx=writing[path].next;delete writing[path];if(nx)gsFlush(path,nx);const el=$('#sync');if(el)el.textContent=syncTxt()}
async function gsBoot(){if(!gsOn())return;try{const c=await gsGet('config/main');if(c&&c.cfg)cfg=fixCfg(c.cfg);const d=await gsGet('days/'+curDate);if(d){day=d;for(const k of Object.keys(newDay(curDate)))if(day[k]==null)day[k]=newDay(curDate)[k]}syncState='gs'}catch(e){syncState='err'}render()}
const saveCfg=()=>persist('config/main',{cfg});
const saveDay=()=>{delete day.demo;persist('days/'+day.date,day)};
const syncTxt=()=>syncState==='gs'?'已同步 Google 試算表':syncState==='cloud'?'已同步到雲端':syncState==='err'?'雲端同步失敗，暫存於本機':'僅存於此瀏覽器';
async function loadDay(date){curDate=date;LS.set('last',date);let d=null;if(gsOn()){try{d=await gsGet('days/'+date)}catch(e){syncState='err'}}if(db){try{const s=await db.doc('days/'+date).get();if(s.exists)d=JSON.parse(JSON.stringify(s.data()))}catch(e){}}
 day=d||LS.get('days/'+date)||newDay(date);for(const k of Object.keys(newDay(date)))if(day[k]==null)day[k]=newDay(date)[k]}

 const w=dowOf(day.date),wk=isoWeek(day.date),par=day.par||(wk%2?'odd':'even');
 const tr=tplRooms(day).map(([r,s])=>`R${r} ${esc(s)}`).join(' · ')||'無固定刀房';
 $('#app').innerHTML=`<header><div class="hrow"><div><h1>泌尿科刀房調度板</h1><div class="sub">${esc(tr)}</div></div>
 <div class="datebox"><label class="sr" for="date" hidden>日期</label><input type="date" id="date" data-ch="date" value="${day.date}" aria-label="日期"><span class="pill" style="background:#fff;color:var(--scrub)">週${DOW[w]} · 第${wk}週 · ${par==='odd'?'單週':'雙週'}</span>
 ${w===6?`<select data-ch="par" aria-label="單雙週"><option value="">自動判斷</option><option value="odd" ${day.par==='odd'?'selected':''}>單週</option><option value="even" ${day.par==='even'?'selected':''}>雙週</option></select>`:''}<span class="sync" id="sync">${syncTxt()}</span></div></div>
 <nav class="tabs" role="tablist">${[['plan','今日排程'],['res','人力與能力'],['set','術式與房間設定']].map(([k,n])=>`<button role="tab" data-act="tab" data-k="${k}" aria-selected="${tab===k}">${n}</button>`).join('')}</nav></header>
 <main>${tab==='plan'?planView(tl,asg,L):tab==='res'?resView():setView()}</main>`}

function planView(tl,asg,L){const S=cfg.set,dl=T(S.deadline),ot=T(S.nurseOT);
 const late=tl.rooms.filter(r=>isGA(r.id)&&r.end>dl),last=tl.rooms.filter(r=>isGA(r.id)).reduce((m,r)=>Math.max(m,r.end),0);
 const top=topS(),topRooms=tl.rooms.filter(r=>r.cases.some(x=>top.includes(x.c.surgeon)));const topBad=L.some(l=>l.lv==='bad'&&l.t.includes('★'));
 const otNeed=late.length+asg.unfilled.length;
 return `${day.demo?`<p class="note">目前顯示範例資料：11/20（五）刀表截圖內容與當天人力，任何修改後即成為你的資料。</p>`:''}
 <section class="kpis">
 <div class="kpi ${tl.rooms.length?'':'warn'}"><span>今日刀房</span><b class="num">${tl.rooms.length||'–'}</b><span>${day.cases.length} 筆刀單${tl.eve.length?`，小夜 ${tl.eve.length}`:''}</span></div>
 <div class="kpi ${last>ot?'bad':last>dl?'warn':'ok'}"><span>最晚預估結束</span><b class="num">${last?HM(last):'–'}</b><span>目標 ${S.deadline} 前</span></div>
 <div class="kpi ${otNeed?'bad':'ok'}"><span>需要加班人力</span><b>${otNeed?late.map(r=>'R'+r.id).concat(asg.unfilled.map(d=>(d.half==='am'?'上':'下')+'R'+d.room)).join('、'):'不需要'}</b><span>${otNeed?'見下方建議':'常規刀可準時完成'}</span></div>
 <div class="kpi ${topRooms.length?(topBad?'bad':'ok'):''}"><span>★ ${esc(top.join('、')||'部長')}</span><b>${topRooms.length?(topBad?'有風險':'人力到位'):'今日無刀'}</b><span>${topRooms.map(r=>'R'+r.id).join('、')}</span></div></section>
 <section class="card"><h2>刀房時間軸與接刀順序 <small>紅線 ${S.deadline}｜橘虛線 ${S.nurseOT}｜紅點線 ${S.dvBlock}</small></h2><div class="row" style="margin-bottom:8px"><button class="btn s" data-act="optimize">一鍵排序（長刀優先、當日刀排下午、門診準時）</button><span class="note" style="margin-left:auto">檢視</span><button class="btn s ${view!=='h'?'tg on':''}" data-act="view" data-v="v">直式</button><button class="btn s ${view==='h'?'tg on':''}" data-act="view" data-v="h">橫式</button>${view!=='h'?'<button class="btn s" data-act="zoom" data-z="-1" aria-label="縮小">－</button><button class="btn s" data-act="zoom" data-z="1" aria-label="放大">＋</button>':''}</div>${view==='h'?gantt(tl,asg,L):vgantt(tl,asg,L)}${selPanel(tl)}</section>
 <section class="two"><div class="card"><h2>待處理 <small>點項目會在時間軸上標出</small></h2>
 ${(()=>{const G=[['ot','超時/加班'],['move','建議跳台'],['eq','機器'],['time','時間'],['staff','人力'],['conc','主治同時多房'],['info','其他']];const cnt=g=>L.filter(l=>l.g===g&&l.lv!=='ok').length;const badN=L.filter(l=>l.lv==='bad').length;
  const shown=L.filter(l=>advF?l.g===advF:(l.lv==='bad'||l.g==='move'||l.lv==='ok'));
  return `<div class="row" style="margin-bottom:8px"><button class="btn s ${!advF?'tg on':''}" data-act="advF" data-g="">重點 ${badN}</button>${G.filter(([g])=>cnt(g)).map(([g,n])=>`<button class="btn s ${advF===g?'tg on':''}" data-act="advF" data-g="${g}">${n} ${cnt(g)}</button>`).join('')}${L.some(l=>l.act)?'<button class="btn s p" data-act="applyAll">套用全部跳台</button>':''}</div>
  <ul class="adv">${shown.map(l=>`<li class="${l.lv}"><button class="advt" data-act="hl" data-ids="${(l.ids||[]).join(',')}">${esc(l.t)}</button><p>${esc(l.b)}</p>${l.act?`<button class="btn s" data-act="apply" data-id="${l.act.id}" data-to="${l.act.to}">套用：移到 R${esc(l.act.to)}</button>`:''}</li>`).join('')||'<li class="ok"><b>這一類沒有問題</b></li>'}</ul>`})()}
 <details style="margin-top:10px"><summary>可借用的空房（供跳台建議）</summary><div class="row">${cfg.rooms.filter(r=>+r.need>0&&!tl.rooms.some(x=>x.id===r.id)).map(r=>`<label class="row" style="gap:4px"><input type="checkbox" data-ch="open" value="${r.id}" ${(day.open||[]).includes(r.id)?'checked':''}> R${esc(r.id)}</label>`).join('')||'<span class="note">所有房間都在使用中</span>'}</div></details></div>
 <div class="card"><h2>匯入刀表</h2>${importBox()}</div></section>
 ${tl.rooms.length?'':`<p class="card note">尚未有刀單。上傳刀表截圖、貼上刀表文字或手動新增後即會排程；人力表目前依週模板預排。</p>`}
 <section class="card"><h2>住院醫師人力表 <small>「自動排」會依能力、主治優先序與白名單分派；可改成 OPD／pm／固定某房</small></h2>${resTable(asg)}
 <div class="two" style="margin-top:12px"><div><h2 style="font-size:16px">專責護理師 OPN</h2>${opnBox(tl)}</div><div><h2 style="font-size:16px">門診灌藥</h2>${instBox(asg)}</div></div></section>
 <section class="card" id="line-sec"><h2>LINE 群組公告 <small>可直接修改後複製</small><button class="btn p" data-act="copy">複製文字</button><label class="row note" style="gap:4px"><input type="checkbox" data-ch="lineExtra" ${day.lineExtra!==false?'checked':''}> 附上加班／跳台提醒</label></h2><textarea class="line" id="line" aria-label="公告文字">${esc(lineText(day,tl,asg,L))}</textarea><p class="note" id="copied"></p></section>`}

function gantt(tl,asg,L){const S=cfg.set,st=T('08:00');let en=Math.max(T('18:30'),...tl.rooms.map(r=>r.end+20));en=Math.ceil(en/60)*60;const P=x=>((x-st)/(en-st)*100).toFixed(2)+'%',W=(a,b)=>((b-a)/(en-st)*100).toFixed(2)+'%';const top=topS(),dl=T(S.deadline),ot=T(S.nurseOT),am=T(S.amEnd);
 const flag={};for(const l of L||[])for(const id of l.ids||[]){(flag[id]=flag[id]||{tags:new Set(),lv:'info'});if(l.tag)flag[id].tags.add(l.tag);if(l.lv==='bad'||(l.lv==='warn'&&flag[id].lv!=='bad'))flag[id].lv=l.lv}
 const lines=`<i class="vl md" style="left:${P(am)}"></i><i class="vl dl" style="left:${P(dl)}"></i><i class="vl ot" style="left:${P(ot)}"></i><i class="vl dv" style="left:${P(T(S.dvBlock))}"></i>`;
 const hrs=[];for(let h=st;h<=en;h+=60)hrs.push(`<span style="left:${P(h)}">${h/60}</span>`);
 const rn=(h,room)=>asg?Object.entries(asg[h]).filter(([,a])=>a.k==='room'&&a.room===room).map(([id])=>(cfg.res.find(r=>r.id===id)||{}).n).join('、'):'';
 const bar=(x,r)=>{const f=flag[x.c.id],tags=[...(f?f.tags:[])];if(x.c.sd)tags.unshift('徑');else if(x.c.clock&&x.c.time)tags.unshift('門'+x.c.time);
  const oi=r.cases.indexOf(x)+1;return `<div class="bar c-${x.cat}${x.c.id===selId?' sel':''}${x.e>dl&&isGA(r.id)?' late':''}${top.includes(x.c.surgeon)?' top':''}${f&&f.lv==='bad'?' fbad':f&&f.lv==='warn'?' fwarn':''}${x.c.fixed?' fixed':''}" data-bar="${x.c.id}" ${x.c.fixed?'':`data-grip="${x.c.id}"`} style="left:${P(x.s)};width:${W(x.s,x.e)}" title="${esc(`${HM(x.s)}–${HM(x.e)} ${x.c.surgeon} ${x.c.procs.join(' + ')}${x.c.fixed?'（08:30 首台固定）':'（可拖曳）'}`)}"><b class="ord">${oi}</b>${tags.map(t=>`<i class="tag">${esc(t)}</i>`).join('')}${esc(x.c.surgeon.slice(0,1)+' '+short(x.c))}</div>`};
 const rows=tl.rooms.length?tl.rooms.map(r=>{const ss=[...new Set(r.cases.map(x=>x.c.surgeon))];const cl=isGA(r.id)?(r.end>ot?'bad':r.end>dl?'warn':''):'';const ra=rn('am',r.id),rp=rn('pm',r.id);
  return `<div class="grow"><div class="glab"><b>R${esc(r.id)}</b><button class="btn s gsort" data-act="sortRoom" data-room="${r.id}" title="依規則重排此房">排序</button><span class="ss">${esc(ss.join('、'))}</span>${isGA(r.id)?(ra||rp?`<span class="rs">${ra===rp?esc(ra):`上 ${esc(ra||'—')}｜下 ${esc(rp||'—')}`}</span>`:''):'<span class="rs">非全麻</span>'}</div><div class="gtrack" data-room="${r.id}">${lines}${r.cases.map(x=>bar(x,r)).join('')}</div><div class="gend ${cl}">${HM(r.end)}</div></div>`}).join(''):`<div class="grow"><div class="glab note">尚無刀單</div><div class="gtrack">${lines}</div><div></div></div>`;
 const eqRows=(cfg.equip||[]).map(eq=>{const us=[];tl.rooms.forEach(r=>r.cases.forEach(x=>{if(equipOf(x.c).includes(eq))us.push({r,x})}));if(!us.length)return'';const q=+eq.q||1;
  return `<div class="grow eqrow"><div class="glab"><b class="eqn">${esc(eq.n)}</b><span class="rs">${q} 台</span></div><div class="gtrack">${lines}${us.map(u=>{const n=us.filter(v=>v.x.s<u.x.e&&u.x.s<v.x.e).length;return `<div class="eqb${n>q?' over':''}" data-bar="${u.x.c.id}" style="left:${P(u.x.s)};width:${W(u.x.s,u.x.e)}" title="${esc(`R${u.r.id} ${HM(u.x.s)}–${HM(u.x.e)} ${short(u.x.c)}`)}">R${esc(u.r.id)}</div>`}).join('')}</div><div></div></div>`}).join('');
 return `<div class="scroll"><div class="gantt"><div class="grow" style="min-height:22px;border:0"><div></div><div class="ticks">${hrs.join('')}</div><div></div></div>${rows}${tl.eve.length?`<div class="grow"><div class="glab"><b>小夜</b></div><div class="evechips">${tl.eve.map(c=>`<button class="btn s${c.id===selId?' tg on':''}" data-act="sel" data-id="${c.id}">R${esc(c.room)} ${esc(c.surgeon)} ${esc(short(c))}</button>`).join('')}</div><div></div></div>`:''}${eqRows?`<div class="gsep">機器使用</div>${eqRows}`:''}</div></div><div class="legend">${CATS.map(([k,n])=>`<span><i class="c-${k}"></i>${n}</span>`).join('')}<span>★ 部長刀</span><span><i style="outline:2px solid var(--red)"></i>有問題</span><span>拖曳色塊可換順序或換房</span></div>`}
let selId=null;
function vgantt(tl,asg,L){const S=cfg.set,st=T('08:00');let en=Math.max(T('18:30'),...tl.rooms.map(r=>r.end+20));en=Math.ceil(en/60)*60;const Y=x=>Math.round((x-st)*ppm),H=Y(en);const top=topS(),dl=T(S.deadline),ot=T(S.nurseOT),am=T(S.amEnd);
 const flag={};for(const l of L||[])for(const id of l.ids||[]){(flag[id]=flag[id]||{tags:new Set(),lv:'info'});if(l.tag)flag[id].tags.add(l.tag);if(l.lv==='bad'||(l.lv==='warn'&&flag[id].lv!=='bad'))flag[id].lv=l.lv}
 const rn=(h,room)=>Object.entries(asg[h]).filter(([,a])=>a.k==='room'&&a.room===room).map(([id])=>(cfg.res.find(r=>r.id===id)||{}).n).join('、');
 const lines=`<i class="hl md" style="top:${Y(am)}px"></i><i class="hl dl" style="top:${Y(dl)}px"></i><i class="hl ot" style="top:${Y(ot)}px"></i><i class="hl dv" style="top:${Y(T(S.dvBlock))}px"></i>`;
 const eqs=(cfg.equip||[]).map(eq=>{const us=[];tl.rooms.forEach(r=>r.cases.forEach(x=>{if(equipOf(x.c).includes(eq))us.push({r,x})}));return{eq,us}}).filter(o=>o.us.length);
 const cols=tl.rooms.length?tl.rooms:[{id:'',cases:[],end:T(S.start)}];
 const head=`<div class="vh vt"></div>${cols.map(r=>{const ss=[...new Set(r.cases.map(x=>x.c.surgeon))],ga=isGA(r.id),cl=ga?(r.end>ot?'bad':r.end>dl?'warn':''):'',ra=ga?rn('am',r.id):'',rp=ga?rn('pm',r.id):'';return `<div class="vh"><div class="row" style="gap:6px;justify-content:space-between"><b class="rn">R${esc(r.id)}</b><span class="gend ${cl}">${r.cases.length?HM(r.end):''}</span></div><div class="ss">${esc(ss.join('、'))}</div><div class="rs">${ga?(ra||rp?(ra===rp?esc(ra):`上 ${esc(ra||'—')}｜下 ${esc(rp||'—')}`):''):'非全麻'}</div>${r.id?`<button class="btn s gsort" data-act="sortRoom" data-room="${r.id}">排序</button>`:''}</div>`}).join('')}${eqs.map(o=>`<div class="vh veh" title="${esc(o.eq.n)}">${esc(o.eq.n)}</div>`).join('')}`;
 const hrs=[];for(let h=st;h<=en;h+=60)hrs.push(`<span style="top:${Y(h)}px">${String(h/60).padStart(2,'0')}:00</span>`);
 const blk=(x,r,i)=>{const f=flag[x.c.id],tags=[...(f?f.tags:[])],c=x.c,hgt=Math.max(Y(x.e)-Y(x.s)-2,14);
  return `<div class="vb c-${x.cat}${c.id===selId?' sel':''}${x.e>dl&&isGA(r.id)?' late':''}${f&&f.lv==='bad'?' fbad':f&&f.lv==='warn'?' fwarn':''}${c.fixed?' fixed':''}${hgt<34?' tiny':''}" data-bar="${c.id}" ${c.fixed?'':`data-grip="${c.id}"`} style="top:${Y(x.s)}px;height:${hgt}px" title="${esc(`${HM(x.s)}–${HM(x.e)} ${c.surgeon} ${c.procs.join(' + ')}`)}">
  <div class="vbh"><b class="ord">${i+1}</b><span class="t">${HM(x.s)}–${HM(x.e)}</span> <b>${esc(c.surgeon)}</b>${top.includes(c.surgeon)?' ★':''}</div>
  <div class="vbp">${esc(c.procs.map(p=>p.replace(/\(廠\)|（廠）/g,'').trim()).join(' ＋ '))}</div>
  <div class="vbt">${c.fixed?'<i class="tag n">首台</i>':''}${c.sd?'<i class="tag a">徑・當日刀</i>':''}${c.wait?`<i class="tag a">TF 前有他科刀・約${esc(cfg.set.robotTF||'13:00')}後</i>`:''}${c.clock&&c.time?`<i class="tag n">門診 ${esc(c.time)}</i>`:c.opd?'<i class="tag n">門診</i>':''}${tags.map(t=>`<i class="tag ${/撞機|門\+/.test(t)?'r':'a'}">${esc(t)}</i>`).join('')}${equipOf(c).map(e=>`<i class="tag n">${esc(e.n)}</i>`).join('')}<i class="tag n">${esc(x.an)} ${x.dur}分</i></div></div>`};
 const body=`<div class="vtime" style="height:${H}px">${hrs.join('')}</div>${cols.map(r=>`<div class="vcol" data-room="${r.id}" style="height:${H}px;background-size:100% ${60*ppm}px">${lines}${r.cases.map((x,i)=>blk(x,r,i)).join('')}</div>`).join('')}${eqs.map(o=>{const q=+o.eq.q||1;return `<div class="vcol veq" style="height:${H}px;background-size:100% ${60*ppm}px">${lines}${o.us.map(u=>{const n=o.us.filter(v=>v.x.s<u.x.e&&u.x.s<v.x.e).length;return `<div class="eqv${n>q?' over':''}" data-bar="${u.x.c.id}" style="top:${Y(u.x.s)}px;height:${Math.max(Y(u.x.e)-Y(u.x.s)-2,10)}px" title="${esc(`${o.eq.n} R${u.r.id} ${HM(u.x.s)}–${HM(u.x.e)}`)}">R${esc(u.r.id)}</div>`}).join('')}</div>`}).join('')}`;
 const eve=tl.eve.length?`<div class="row" style="margin-top:8px"><b>小夜</b>${tl.eve.map(c=>`<button class="btn s${c.id===selId?' tg on':''}" data-act="sel" data-id="${c.id}">R${esc(c.room)} ${esc(c.surgeon)} ${esc(short(c))}</button>`).join('')}</div>`:'';
 const gt=`44px repeat(${cols.length},minmax(170px,1fr))${eqs.length?` repeat(${eqs.length},38px)`:''}`;
 return `<div class="scroll vwrap"><div class="vgrid" style="grid-template-columns:${gt}">${head}${body}</div></div>${eve}<div class="legend">${CATS.map(([k,n])=>`<span><i class="c-${k}"></i>${n}</span>`).join('')}<span>最右窄欄＝機器使用，紅色＝撞機</span><span>拖曳方塊可換順序或換房</span></div>`}
function selPanel(tl){let x=null,r=null,i=-1;for(const rr of tl.rooms){const k=rr.cases.findIndex(y=>y.c.id===selId);if(k>=0){x=rr.cases[k];r=rr;i=k}}const ev=!x&&tl.eve.find(c=>c.id===selId);
 if(!x&&!ev)return `<p class="note selhint">點時間軸上的色塊即可在這裡編輯（預期時間、當日刀、移房、併台、刪除）；直接拖曳色塊可換順序或換房。</p>`;

function loadTess(){return new Promise((ok,no)=>{if(window.Tesseract)return ok(window.Tesseract);const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=()=>ok(window.Tesseract);sc.onerror=()=>no(new Error('load'));document.head.appendChild(sc)})}
async function prep(file){const img=await createImageBitmap(file);const k=Math.min(3,Math.max(1.5,1800/img.width));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.drawImage(img,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),a=d.data;for(let i=0;i<a.length;i+=4){const r=a[i],g=a[i+1],b=a[i+2];const red=r>150&&g<110&&b<110;let v=red?0:(.3*r+.59*g+.11*b);v=v<165?0:255;a[i]=a[i+1]=a[i+2]=v}x.putImageData(d,0,0);return c}
async function ocrParse(files){if(ocrBusy)return;ocrBusy=true;let out=[];try{busy='載入文字辨識引擎…';render();const Ts=await loadTess();const w=await Ts.createWorker('chi_tra+eng',1,{logger:m=>{if(m.status==='recognizing text'){const el=$('#aimsg');if(el)el.textContent=`辨識中 ${Math.round(m.progress*100)}%`}else if(/load/.test(m.status)){const el=$('#aimsg');if(el)el.textContent='下載中文字庫…（只有第一次較久）'}}});await w.setParameters({preserve_interword_spaces:'1'});

document.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-grip]');if(!g){const b=e.target.closest('[data-bar]');if(b)pend={id:b.dataset.bar,x:e.clientX,y:e.clientY,click:true};return}e.preventDefault();pend={id:g.dataset.grip,x:e.clientX,y:e.clientY,el:g.closest('.case,.bar,.vb')}});
function startDrag(e){const c=byId(pend.id);if(!c||!pend.el){pend=null;return}const gh=document.createElement('div');gh.className='ghost';gh.textContent=`${c.surgeon}　${short(c)}`;document.body.appendChild(gh);pend.el.classList.add('dragging');drag={id:c.id,gh,li:pend.el,t:null};pend=null}
document.addEventListener('pointermove',e=>{if(pend&&!drag){if(pend.el&&Math.hypot(e.clientX-pend.x,e.clientY-pend.y)>6)startDrag(e);else return}if(!drag)return;e.preventDefault();drag.gh.style.left=e.clientX+12+'px';drag.gh.style.top=e.clientY+8+'px';clearMarks();drag.t=dropTarget(e.clientX,e.clientY);if(drag.t){drag.t.el.classList.add(drag.t.cls);if(drag.t.line||drag.t.ltop){let ln=document.querySelector('.dropline');if(!ln){ln=document.createElement('i');ln.className='dropline'}drag.t.el.appendChild(ln);if(drag.t.ltop){ln.className='dropline h';ln.style.top=drag.t.ltop;ln.style.left='0'}else{ln.className='dropline';ln.style.left=drag.t.line;ln.style.top=''}}}const m=60;if(e.clientY<m)window.scrollBy(0,-12);else if(e.clientY>window.innerHeight-m)window.scrollBy(0,12)},{passive:false});
document.addEventListener('pointerup',e=>{if(pend&&!drag){const id=pend.id,click=pend.click||pend.el&&(pend.el.classList.contains('bar')||pend.el.classList.contains('vb'));pend=null;if(click){selId=id;render();const p=document.querySelector('.selp');if(p&&p.scrollIntoView)p.scrollIntoView({block:'nearest',behavior:'smooth'})}return}pend=null;endDrag(true)});document.addEventListener('pointercancel',()=>endDrag(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(drag)endDrag(false);else if(selId){selId=null;render()}}});
render();gsBoot();
if(/^#(line|today)$/.test(location.hash))setTimeout(()=>{const e=$('#line-sec');if(e)e.scrollIntoView()},300);
(async()=>{const C=typeof window.claude!=='undefined'&&window.claude&&window.claude.use?window.claude:null;if(!C)return;
 try{db=await C.use('db')}catch(e){db=null}
 if(db){const tm=setTimeout(()=>{syncState='err';const el=$('#sync');if(el)el.textContent=syncTxt()},10000);
  try{const s=await db.doc('config/main').get();clearTimeout(tm);if(s.exists&&s.data().cfg){cfg=fixCfg(JSON.parse(JSON.stringify(s.data().cfg)))}syncState='cloud';
   const d=await db.doc('days/'+curDate).get();if(d.exists){day=JSON.parse(JSON.stringify(d.data()));for(const k of Object.keys(newDay(curDate)))if(day[k]==null)day[k]=newDay(curDate)[k]}}catch(e){clearTimeout(tm);syncState='err'}
  render()}
 try{sampler=await C.use('sample')}catch(e){sampler=null}render()})();
}
</script>
