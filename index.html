<title>泌尿科刀房調度板</title>

<style>
/* VOICE: clinical, calm, exact — a chief resident's tool used every afternoon
   IDEA: the OR control-desk whiteboard: rooms as lanes, the 16:00 line drawn in red
   PICTURE: live Gantt of every room with 16:00 / 17:30 / 18:00 lines, cases as coloured blocks
   COLOUR and TYPE: white ground, scrub teal #0b5563 band, coral red for overtime; Noto Sans TC + Figtree figures
   LAYOUT: band header → summary → Gantt → advice + rooms → staffing → LINE text; settings in tabs */
:root{color-scheme:light dark;--bg:light-dark(#f4f7f7,#0b1315);--card:light-dark(#fff,#121e21);--ink:light-dark(#0f262b,#e2edee);--mut:light-dark(#587076,#8ea6aa);--line:light-dark(#d8e2e3,#24363a);--scrub:light-dark(#0b5563,#0e6474);--soft:light-dark(#e4f0f1,#15313a);--red:#e5484d;--redbg:light-dark(#fdecec,#3a1a1c);--amb:#c77d00;--ambbg:light-dark(#fff4dc,#3a2c10);--ok:#1f8a5b;--okbg:light-dark(#e6f5ee,#123227)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
.num,.t{font-family:Figtree,"Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
header{background:var(--scrub);color:#fff;padding:18px max(4vw,14px) 0}
.hrow{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;max-width:1320px;margin:auto}
h1{font:800 clamp(24px,3.4vw,36px)/1.05 Figtree,"Noto Sans TC",sans-serif;margin:0;letter-spacing:.01em}
.sub{opacity:.85;font-size:14px}
.datebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.datebox input,.datebox select{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:8px 10px;font:16px Figtree,sans-serif;min-height:44px}
.datebox select option{color:#000}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:4px;max-width:1320px;margin:14px auto 0;overflow-x:auto}
.tabs button{background:transparent;color:#fff;border:0;border-radius:10px 10px 0 0;padding:11px 18px;font:500 15px "Noto Sans TC",sans-serif;min-height:44px;cursor:pointer;opacity:.8;flex:none}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink);opacity:1;font-weight:700}
main{max-width:1320px;margin:auto;padding:18px max(4vw,14px) 60px}
section{margin-bottom:22px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}

.kpi span{color:var(--mut);font-size:13px}
.kpi.bad{border-color:var(--red);background:var(--redbg)}.kpi.warn{border-color:var(--amb);background:var(--ambbg)}.kpi.ok{border-color:var(--ok);background:var(--okbg)}
.scroll{overflow-x:auto}

button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 12px;min-height:40px;cursor:pointer}

select,input[type=text],input[type=number],input[type=time],textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:16px;min-height:38px}
input[type=number]{width:74px;text-align:right}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.drop{border:2px dashed var(--line);border-radius:14px;padding:16px;text-align:center;background:var(--card)}
.drop.on{border-color:var(--scrub);background:var(--soft)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:middle;font-size:14px}
th{font-size:12.5px;color:var(--mut);font-weight:500;white-space:nowrap}
.res td select{min-width:92px}
.as{font-weight:700;white-space:nowrap}.as.bad{color:var(--red)}.as.warn{color:var(--amb)}
.ab select{min-width:64px;font-size:14px;padding:4px}
.ab0{background:light-dark(#f1f1f1,#222)!important}.ab1{background:light-dark(#fff6d9,#3a3010)!important}.ab2{background:light-dark(#dff0fb,#123047)!important}.ab3{background:light-dark(#d9f3e5,#113524)!important}
textarea.line{width:100%;min-height:300px;font:15px/1.5 "Noto Sans TC",monospace}
.note{font-size:13px;color:var(--mut)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs img{height:70px;border-radius:6px;border:1px solid var(--line)}
details summary{cursor:pointer;font-weight:700;min-height:36px;display:flex;align-items:center}
.sync{font-size:12px;opacity:.9}

.bar{cursor:grab;touch-action:none}.bar.fixed{cursor:default;opacity:.92}.bar.fbad{outline:2px solid var(--red);outline-offset:1px}.bar.fwarn{outline:2px dashed var(--amb);outline-offset:1px}.bar .tag{font-style:normal;background:rgba(0,0,0,.35);border-radius:4px;padding:0 4px;margin-right:3px;font-size:11px}

function gantt(tl,asg,L){const S=cfg.set,st=T('08:00');let en=Math.max(T('18:30'),...tl.rooms.map(r=>r.end+20));en=Math.ceil(en/60)*60;const P=x=>((x-st)/(en-st)*100).toFixed(2)+'%',W=(a,b)=>((b-a)/(en-st)*100).toFixed(2)+'%';const top=topS(),dl=T(S.deadline),ot=T(S.nurseOT),am=T(S.amEnd);

 const rows=tl.rooms.length?tl.rooms.map(r=>{const ss=[...new Set(r.cases.map(x=>x.c.surgeon))];const cl=otRm(r.id)?(r.end>ot?'bad':r.end>dl?'warn':''):'';const ra=rn('am',r.id),rp=rn('pm',r.id);

function otPlan(tl,asg){const S=cfg.set,dl=T(S.deadline),top=topS();const rooms=tl.rooms.filter(r=>otRm(r.id)&&r.cases.length);
 const ot=rooms.filter(r=>r.end>dl).sort((a,b)=>b.end-a.end),risk=rooms.filter(r=>r.end<=dl&&r.end>dl-30);

 const resIn=room=>Object.entries(asg.pm).filter(([,a])=>a.k==='room'&&a.room===room).map(([id])=>(cfg.res.find(r=>r.id===id)||{}).n);
 const jumps=ot.map(r=>{const over=r.end-dl,turn=roomTurn(r.id);const vs=[...new Set(r.cases.map(x=>x.c.surgeon))];
  const cand=r.cases.filter(x=>!x.c.fixed&&!x.c.wait&&!isRob(x.cat)&&!top.includes(x.c.surgeon)).sort((a,b)=>a.dur-b.dur);const pick=[];let saved=0,blocked=0;
  for(const x of cand){if(saved>=over)break;const others=tl.rooms.filter(o=>o.id!==r.id&&o.cases.some(y=>y.c.surgeon===x.c.surgeon&&y.s<x.e&&y.e>x.s)).length;if(others>=1){blocked++;continue}pick.push(x);saved+=x.dur+turn}
  const topRoom=r.cases.some(x=>top.includes(x.c.surgeon));return{r,vs,over,pick,saved:Math.min(saved,over+60),newEnd:r.end-saved,blocked,topRoom}}).sort((a,b)=>b.over-a.over);
 return{ot,risk,hours,eve:tl.eve.length,jumps,resIn}}

function roomRuleOK(c,room){const t=(c.procs.join(' ')+' '+(c.spec||[]).join(' ')).toLowerCase();for(const rl of cfg.roomRules||[]){const ks=String(rl.k||'').split(/[,，]/).map(y=>y.trim().toLowerCase()).filter(Boolean),ok=String(rl.rooms||'').split(/[,，、\s]+/).map(y=>y.trim().replace(/^R/i,'')).filter(Boolean);if(ks.length&&ok.length&&ks.some(k=>t.includes(k))&&!ok.includes(String(room)))return false}return true}

async function dutyImgParse(f){const msg=t=>{const m=$('#dutyimgmsg');if(m)m.textContent=t};if(!sampler){msg('圖片辨識需在 Claude 線上版開啟；請改用貼上文字。');return}
 msg('辨識中，約需 20–60 秒…');const mo=dutyMonth||day.date.slice(0,7);
 const prompt=`這是醫院外科部病房值班表圖片。請讀出每一天（日期列）的以下欄位人名，依原文字輸出 JSON，不要其他文字：{"year":西元年或民國年,"month":月份數字,"days":[{"d":日,"gu1":"GU+CS+CVS 欄一線人名","gu2":"GU+CS+CVS 欄二線人名","icu":["4BI、3BI-T1、3BI-T2 等加護病房欄位的所有人名"],"tot":"總值人名"}]}。看不清楚的字依常見人名補全，空格就填空字串。`;
 try{let v;if(typeof sampler.json==='function')v=await sampler.json(prompt,{images:[f],modelTier:'default'});else{const r=await sampler(prompt,{images:[f],modelTier:'default'});const m=String(r.text).match(/\{[\s\S]*\}/);v=m?JSON.parse(m[0]):null}
  if(!v||!Array.isArray(v.days)){msg('沒有讀到日期列，請確認圖片。');return}
  let Y=+v.year||+mo.slice(0,4),M=+v.month||+mo.slice(5,7);if(Y<1911)Y+=1911;const pad=n=>String(n).padStart(2,'0');
  const match=name=>{name=String(name||'').replace(/\s/g,'');if(!name)return null;const r=cfg.res.find(r=>resKeys(r).some(k=>k&&(name.includes(k)||k.includes(name)&&name.length>=2)));return r?r.id:null};
  cfg.duty=cfg.duty||{};let n=0,days=0;
  for(const row of v.days){const d=+row.d;if(!d||d>31)continue;const ds=`${Y}-${pad(M)}-${pad(d)}`;const L=[];const add=(nm,ro)=>{const id=match(nm);if(id&&!L.some(x=>x.startsWith(id+':')))L.push(id+':'+ro)};
   add(row.gu2,'sec');add(row.gu1,'w1');(Array.isArray(row.icu)?row.icu:[row.icu]).forEach(x=>add(x,'icu'));add(row.tot,'tot');days++;
   if(L.length){cfg.duty[ds]=L;n+=L.length}else delete cfg.duty[ds]}
  dutyMonth=`${Y}-${pad(M)}`;saveCfg();render();msg(`已匯入 ${Y}/${M} 共 ${days} 天、本科 ${n} 人次。請對照月曆，名字不對可點掉重加。`)}catch(e){msg(e&&e.code==='rate_limited'?'請稍後再試':'辨識失敗，請改用貼上文字。')}}

 pasteText=out.join('\n').split('\n').map(l=>l.replace(/\s{2,}/g,'  ').trim()).filter(Boolean).join('\n');const n=parseText(pasteText,day.date).length;busy=n?`辨識出 ${n} 列，請檢查下方文字（主治、房號、TF）後按「解析並加入」。`:'辨識不到刀單列，請改用貼上 HIS 文字，或修正下方文字後再解析。'}catch(e){busy='無法載入文字辨識（可能網路被擋），請改用貼上 HIS 文字。'}ocrBusy=false;render()}

document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el)ch(el.dataset.ch,el)});
document.addEventListener('paste',e=>{const t=e.target;if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'))return;const fs=[...(e.clipboardData||{}).files||[]].filter(f=>/^image\//.test(f.type));if(fs.length){e.preventDefault();tab='plan';handleFiles(fs)}});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('on')}});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();const fs=[...e.dataTransfer.files].filter(f=>/^image\//.test(f.type));if(fs.length)handleFiles(fs)}});
function placeCase(c,room,beforeId){const from=c.room;c.eve=false;c.room=room;const list=day.cases.filter(x=>x.room===room&&!x.eve&&x!==c).sort((a,b)=>(b.fixed?1:0)-(a.fixed?1:0)||a.order-b.order);let i=beforeId?list.findIndex(x=>x.id===beforeId):list.length;if(i<0)i=list.length;while(i<list.length&&list[i].fixed)i++;list.splice(i,0,c);list.forEach((x,j)=>x.order=j+1);if(from!==room)renum(from)}
let drag=null;
function clearMarks(){document.querySelectorAll('.dropb,.dropend,.droprow').forEach(e=>e.classList.remove('dropb','dropend','droprow'));const ln=document.querySelector('.dropline');if(ln)ln.remove()}
function dropTarget(x,y){const el=document.elementFromPoint(x,y);if(!el)return null;const vc=el.closest('.vcol[data-room]');if(vc&&vc.dataset.room){const rc=vc.getBoundingClientRect();const bl=[...vc.querySelectorAll('.vb[data-bar]')].filter(b=>b.dataset.bar!==drag.id);let before=null,ly=null;for(const b of bl){const r2=b.getBoundingClientRect();if(y<r2.top+r2.height/2&&!b.classList.contains('fixed')){before=b.dataset.bar;ly=r2.top-rc.top-3;break}}if(ly==null){const lb=bl[bl.length-1];ly=lb?lb.getBoundingClientRect().bottom-rc.top+1:0}return{room:vc.dataset.room,before,el:vc,cls:'droprow',line:null,ltop:Math.max(0,ly)+'px'}}const tr=el.closest('.gtrack[data-room]');if(tr){const rc=tr.getBoundingClientRect();const room=tr.dataset.room;const bars=[...tr.querySelectorAll('[data-bar]')].filter(b=>b.dataset.bar!==drag.id);let before=null,lx=rc.width;for(const b of bars){const r2=b.getBoundingClientRect();if(x<r2.left+r2.width/2&&!b.classList.contains('fixed')){before=b.dataset.bar;lx=r2.left-rc.left-2;break}}if(!before&&bars.length){const lb=bars[bars.length-1].getBoundingClientRect();lx=lb.right-rc.left+1}return{room,before,el:tr,cls:'droprow',line:Math.max(0,lx)+'px'}}const li=el.closest('.case[data-id]');if(li&&li.dataset.id!==drag.id){const rc=li.getBoundingClientRect();const room=li.closest('[data-room]').dataset.room;if(y>rc.top+rc.height/2){const nx=li.nextElementSibling;return nx?{room,before:nx.dataset.id,el:nx,cls:'dropb'}:{room,before:null,el:li.parentElement,cls:'dropend'}}return{room,before:li.dataset.id,el:li,cls:'dropb'}}const card=el.closest('.room[data-room]');if(card){const ul=card.querySelector('.cases');return{room:card.dataset.room,before:null,el:ul,cls:'dropend'}}return null}
function flash(ids){let first=null;for(const id of ids){document.querySelectorAll(`[data-bar="${id}"],.case[data-id="${id}"]`).forEach(el=>{el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');if(!first&&el.classList.contains('bar'))first=el})}if(first&&first.scrollIntoView)first.scrollIntoView({block:'center',behavior:'smooth'})}
let pend=null;
function endDrag(ok){if(!drag)return;const d=drag;drag=null;d.gh.remove();d.li.classList.remove('dragging');clearMarks();if(ok&&d.t){placeCase(byId(d.id),d.t.room,d.t.before);saveDay();render()}}
document.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-grip]');if(!g){const b=e.target.closest('[data-bar]');if(b)pend={id:b.dataset.bar,x:e.clientX,y:e.clientY,click:true};return}e.preventDefault();pend={id:g.dataset.grip,x:e.clientX,y:e.clientY,el:g.closest('.case,.bar,.vb')}});
function startDrag(e){const c=byId(pend.id);if(!c||!pend.el){pend=null;return}const gh=document.createElement('div');gh.className='ghost';gh.textContent=`${c.surgeon}　${short(c)}`;document.body.appendChild(gh);pend.el.classList.add('dragging');drag={id:c.id,gh,li:pend.el,t:null};pend=null}
document.addEventListener('pointermove',e=>{if(pend&&!drag){if(pend.el&&Math.hypot(e.clientX-pend.x,e.clientY-pend.y)>6)startDrag(e);else return}if(!drag)return;e.preventDefault();drag.gh.style.left=e.clientX+12+'px';drag.gh.style.top=e.clientY+8+'px';clearMarks();drag.t=dropTarget(e.clientX,e.clientY);if(drag.t){drag.t.el.classList.add(drag.t.cls);if(drag.t.line||drag.t.ltop){let ln=document.querySelector('.dropline');if(!ln){ln=document.createElement('i');ln.className='dropline'}drag.t.el.appendChild(ln);if(drag.t.ltop){ln.className='dropline h';ln.style.top=drag.t.ltop;ln.style.left='0'}else{ln.className='dropline';ln.style.left=drag.t.line;ln.style.top=''}}}const m=60;if(e.clientY<m)window.scrollBy(0,-12);else if(e.clientY>window.innerHeight-m)window.scrollBy(0,12)},{passive:false});
document.addEventListener('pointerup',e=>{if(pend&&!drag){const id=pend.id,click=pend.click||pend.el&&(pend.el.classList.contains('bar')||pend.el.classList.contains('vb'));pend=null;if(click){selId=id;render();const p=document.querySelector('.selp');if(p&&p.scrollIntoView)p.scrollIntoView({block:'nearest',behavior:'smooth'})}return}pend=null;endDrag(true)});document.addEventListener('pointercancel',()=>endDrag(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(drag)endDrag(false);else if(selId){selId=null;render()}}});
let rzT=null;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{const a=document.activeElement;if(!drag&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render()},250)});
render();gsBoot().then(loadNext);
if(/^#(line|today)$/.test(location.hash))setTimeout(()=>{const e=$('#line-sec');if(e)e.scrollIntoView()},300);
(async()=>{const C=typeof window.claude!=='undefined'&&window.claude&&window.claude.use?window.claude:null;if(!C)return;
 try{db=await C.use('db')}catch(e){db=null}
 if(db){const tm=setTimeout(()=>{syncState='err';const el=$('#sync');if(el)el.textContent=syncTxt()},10000);
  try{const s=await db.doc('config/main').get();clearTimeout(tm);if(s.exists&&s.data().cfg){cfg=fixCfg(JSON.parse(JSON.stringify(s.data().cfg)))}syncState='cloud';
   const d=await db.doc('days/'+curDate).get();if(d.exists){day=JSON.parse(JSON.stringify(d.data()));for(const k of Object.keys(newDay(curDate)))if(day[k]==null)day[k]=newDay(curDate)[k]}}catch(e){clearTimeout(tm);syncState='err'}
  render();loadNext()}
 try{sampler=await C.use('sample')}catch(e){sampler=null}render()})();

let erDrag=null;
const erClr=()=>document.querySelectorAll('.erov-a,.erov-b').forEach(x=>x.classList.remove('erov-a','erov-b'));
document.addEventListener('pointerdown',ev=>{const h=ev.target.closest&&ev.target.closest('[data-erdrag]');if(!h)return;const it=h.closest('[data-eri]');if(!it)return;ev.preventDefault();ev.stopPropagation();erDrag={i:+it.dataset.eri,el:it,y:ev.clientY,over:null,after:false};it.classList.add('erdragging');it.style.pointerEvents='none';try{h.setPointerCapture(ev.pointerId)}catch(e){}},true);
document.addEventListener('pointermove',ev=>{if(!erDrag)return;ev.preventDefault();erDrag.el.style.transform=`translateY(${ev.clientY-erDrag.y}px)`;const t=document.elementFromPoint(ev.clientX,ev.clientY);const o=t&&t.closest&&t.closest('[data-eri]');erClr();if(o&&o!==erDrag.el){const r=o.getBoundingClientRect();erDrag.after=ev.clientY>r.top+r.height/2;o.classList.add(erDrag.after?'erov-b':'erov-a');erDrag.over=+o.dataset.eri}else erDrag.over=null;if(ev.clientY<70)scrollBy(0,-14);else if(ev.clientY>innerHeight-70)scrollBy(0,14)},{passive:false});
const erDrop=()=>{if(!erDrag)return;const d=erDrag;erDrag=null;erClr();d.el.style.transform='';d.el.style.pointerEvents='';d.el.classList.remove('erdragging');if(d.over==null||d.over===d.i)return;const L=erSorted().filter(e=>e.st!=='done');const e=ERS.items[d.i],tg=ERS.items[d.over];if(!e||!tg)return;L.splice(L.indexOf(e),1);let k=L.indexOf(tg);if(k<0)return;if(d.after)k++;L.splice(k,0,e);L.forEach((x,n)=>x.ord=n);saveER();render()};
document.addEventListener('pointerup',erDrop);document.addEventListener('pointercancel',erDrop);

/* ===== 共用人員名冊（科務入口 common/people）===== */
const lvDefAb=lv=>{const m={R1:[2,1,1,1,1,1,0,1,1,1,0],R2:[2,2,2,1,1,1,1,2,2,2,0],R3:[3,3,3,2,2,2,1,2,3,3,1],R4:[3,3,3,2,2,2,3,3,3,3,2],R5:[3,3,3,3,3,3,3,3,3,3,2],CR:[3,3,3,3,3,3,3,3,3,3,2],Fellow:[3,3,3,3,3,3,3,3,3,3,3]};return mkAb(m[lv]||m.R1)};
const fullOf=r=>(String(r.alias||'').split(/[,，]/)[0]||'').trim();
const resToP=(r,old)=>({id:r.id,n:r.n,full:fullOf(r)||(old&&old.full)||'',role:r.lv==='Fellow'?'F':'R',lv:r.lv,on:!!r.on});
function rosterFromCfg(){const now=Date.now();return{ts:now,people:[...cfg.res.map(r=>({...resToP(r),ts:now})),...cfg.sur.map(x=>({id:'vs_'+x.n,n:x.n,full:x.n,role:'VS',lv:x.t||'主治醫師',on:true,ts:now}))]}}
function applyRoster(R){let ch=false;for(const p of R.people||[]){if(p.role==='VS'){if(p.on!==false&&p.n&&!cfg.sur.some(x=>x.n===p.n)){cfg.sur.push({n:p.n,p:5,sp:1});ch=true}continue}
  let r=cfg.res.find(x=>x.id===p.id);if(!r){if(p.on===false||cfg.res.some(x=>x.n===p.n))continue;r={id:p.id,n:p.n,lv:p.role==='F'?'Fellow':(p.lv||'R1'),on:true,ab:lvDefAb(p.role==='F'?'Fellow':p.lv)};if(p.full&&p.full!==p.n)r.alias=p.full;cfg.res.push(r);ch=true;continue}
  const lv=p.role==='F'?'Fellow':(p.lv||r.lv),on=p.on!==false;let al=r.alias||'';if(p.full&&p.full!==p.n&&fullOf(r)!==p.full)al=[p.full,...String(al).split(/[,，]/).map(x=>x.trim()).filter(x=>x&&x!==p.full)].join(',');
  if(r.n!==p.n||r.lv!==lv||!!r.on!==on||al!==(r.alias||'')){r.n=p.n;r.lv=lv;r.on=on;if(al)r.alias=al;ch=true}}return ch}
let rosterT=null,rosterDel=new Set();
function rosterPushSoon(delId){if(delId)rosterDel.add(delId);clearTimeout(rosterT);rosterT=setTimeout(rosterPush,1500)}
async function rosterPush(){if(!gsOn())return;try{const R=(await gsGet('common/people'))||{people:[]};R.people=R.people||[];const now=Date.now();let ch=false;
  for(const r of cfg.res){const p=R.people.find(x=>x.id===r.id);const v=resToP(r,p);if(!p){R.people.push({...v,ts:now});ch=true}else if(p.n!==v.n||p.lv!==v.lv||!!(p.on!==false)!==v.on||p.role!==v.role||(v.full&&p.full!==v.full)){Object.assign(p,v,{ts:now});ch=true}}
  for(const id of rosterDel){const p=R.people.find(x=>x.id===id);if(p&&!cfg.res.some(x=>x.id===id)){p.on=false;p.ts=now;ch=true}}rosterDel.clear();
  if(ch){R.ts=now;await gsSet('common/people',R)}}catch(e){}}
async function rosterSync(){if(!gsOn())return;try{const R=await gsGet('common/people');if(!R||!Array.isArray(R.people)){await gsSet('common/people',rosterFromCfg());return}
  if(applyRoster(R)){saveCfg();render()}if(cfg.res.some(r=>!R.people.some(p=>p.id===r.id)))rosterPush()}catch(e){}}

 </div><p class="note" style="margin-top:10px">手機：用瀏覽器開網址 →「分享／⋮」→「加入主畫面」，就像 App 一樣。有問題或建議請寫在「意見回饋」。</p></section>`}

/* 顯示用職稱（例如 黃冠華 → 黃冠華部長）；資料本身仍用原名比對刀表 */
function titleize(root){const T=(cfg.sur||[]).filter(x=>x.t&&x.n);if(!T.length||!root)return;const re=new RegExp('('+T.map(x=>x.n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?!'+T.map(x=>x.t).join('|')+')','g');const mp=Object.fromEntries(T.map(x=>[x.n,x.n+x.t]));
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentNode&&n.parentNode.nodeName;return p==='OPTION'||p==='SCRIPT'||p==='STYLE'||p==='DATALIST'?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});const ns=[];while(w.nextNode())ns.push(w.currentNode);
 for(const n of ns){re.lastIndex=0;if(re.test(n.nodeValue)){re.lastIndex=0;n.nodeValue=n.nodeValue.replace(re,m=>mp[m]||m)}}}
