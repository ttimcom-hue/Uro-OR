<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="交班"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><link rel="manifest" href="handoff.webmanifest"><link rel="apple-touch-icon" href="hub-apple-touch-icon.png?v=2"><link rel="icon" type="image/png" href="hub-favicon.png?v=2"><meta name="theme-color" content="#0b5563"><meta property="og:title" content="泌尿科交班"><meta property="og:description" content="黃部長住院・其他主治交班・出院・特殊個案"><meta property="og:image" content="og-hub.png?v=2"><meta property="og:type" content="website">
<title>泌尿科交班</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f7f7,#0b1315);--card:light-dark(#fff,#121e21);--ink:light-dark(#0f262b,#e2edee);--mut:light-dark(#587076,#8ea6aa);--line:light-dark(#d8e2e3,#24363a);--scrub:light-dark(#0b5563,#0e6474);--soft:light-dark(#e4f0f1,#15313a);--red:#e5484d;--redbg:light-dark(#fdecec,#3a1a1c);--amb:#c77d00;--ambbg:light-dark(#fff4dc,#3a2c10);--ok:#1f8a5b}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans TC",system-ui,sans-serif}
.t{font-family:Figtree,"Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
header{background:var(--scrub);color:#fff;padding:18px max(4vw,14px) 0}
.hrow{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between;max-width:1100px;margin:auto}
h1{font:800 clamp(24px,3.4vw,34px)/1.1 Figtree,"Noto Sans TC",sans-serif;margin:0}
.sub{opacity:.85;font-size:14px}
.tabs{display:flex;gap:4px;max-width:1100px;margin:14px auto 0;overflow-x:auto}
.tabs a{color:#fff;text-decoration:none;border-radius:10px 10px 0 0;padding:11px 18px;opacity:.8;flex:none;min-height:44px}
.tabs a[aria-current=page]{background:var(--bg);color:var(--ink);opacity:1;font-weight:700}
.tabs .sep{flex:none;width:1px;background:rgba(255,255,255,.3);margin:10px 6px}
.tabs a.ext{font-size:14px}
.hbtn{color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:3px 12px;font-size:13px;text-decoration:none;white-space:nowrap}
.hside{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a.kpi{color:inherit;text-decoration:none}a.kpi:hover{border-color:var(--scrub)}
.tool .go{color:inherit;text-decoration:none;display:block}
.tool .ic{font-size:20px;margin-right:6px}
main{max-width:1100px;margin:auto;padding:18px max(4vw,14px) 60px}
section{margin-bottom:22px}
h2{font:700 19px/1.3 "Noto Sans TC",sans-serif;margin:0 0 10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h2 small{font-weight:400;color:var(--mut);font-size:13px}h2 small a{color:var(--scrub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.tool{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--scrub);border-radius:14px;padding:14px 16px;min-height:96px}
.tool:hover{border-color:var(--scrub)}
.tool b{font-size:17px}.tool p{margin:4px 0 0;color:var(--mut);font-size:13.5px}
.tool.soon{border-left-color:var(--line);opacity:.75;cursor:default}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12.5px;background:var(--soft);white-space:nowrap}
.chip.r{background:var(--redbg);color:var(--red)}.chip.a{background:var(--ambbg);color:var(--amb)}.chip.g{color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font:800 26px/1.1 Figtree,sans-serif}.kpi span{color:var(--mut);font-size:13px}
.note{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;min-height:40px;cursor:pointer}
.btn.p{background:var(--scrub);color:#fff;border-color:var(--scrub)}.btn.s{min-height:32px;padding:4px 10px;font-size:13.5px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:38px}
table{width:100%;border-collapse:collapse}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:13px;color:var(--mut);font-weight:500}
tr.off td{opacity:.5}
.dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}.dl dt{color:var(--mut)}.dl dd{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;background:var(--card);color:var(--ink);padding:6px 12px;font:inherit;cursor:pointer;min-height:36px}.seg button.on{background:var(--scrub);color:#fff}
@media (max-width:700px){
 .kpis{grid-template-columns:repeat(2,1fr);gap:8px}.kpi{padding:10px}.kpi b{font-size:22px}.kpi span{font-size:12px}.tool{min-height:0}
 table.stack thead{display:none}table.stack tr{display:grid;grid-template-columns:1fr 1fr;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}table.stack td{border:0;padding:0}table.stack td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:var(--mut)}table.stack input,table.stack select{width:100%}
}
.imodal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9999;padding:12px}.ibox{background:var(--card,#fff);color:var(--ink,#0f262b);border-radius:16px;max-width:420px;width:100%;padding:16px 18px;font-size:15px;line-height:1.6;box-shadow:0 10px 40px rgba(0,0,0,.3)}.ihead{display:flex;gap:12px;align-items:center;margin-bottom:8px}.ihead img{border-radius:11px}.ibox ol{padding-left:22px;margin:8px 0}.ibox li{margin:4px 0}.ik{display:inline-block;border:1px solid var(--line,#ccc);border-radius:6px;padding:0 6px;font-weight:700}.inote{color:var(--mut,#587076);font-size:13px;margin:4px 0}.ishare{border-top:1px solid var(--line,#ddd);margin-top:10px;padding-top:10px}.ishare input{width:100%;font-size:13px;margin:4px 0}.ibtn{border:1px solid var(--line,#ccc);background:var(--card,#fff);color:inherit;border-radius:10px;padding:8px 14px;font:inherit;min-height:40px;margin:4px 6px 0 0;cursor:pointer}.ibtn.p{background:#0b5563;color:#fff;border-color:#0b5563}@media(min-width:700px){.imodal{align-items:center}}

.hbtn{cursor:pointer;font:inherit;font-size:13px}.hbtn.on{background:#fff;color:var(--scrub)}
h3{font-size:15px;margin:14px 0 6px;color:var(--mut);font-weight:700}
h3.mon{color:var(--ink);font-size:17px;margin:18px 2px 8px}
.card+.card,section.card{margin-bottom:14px}
.hero{border-left:6px solid var(--scrub)}.big{font:800 26px/1.2 Figtree,"Noto Sans TC",sans-serif;margin:2px 0 6px}
.tl{margin:6px 0;padding-left:20px}.tl li{margin:5px 0}.tl li .btn{margin-left:6px}
.tl li.todo{list-style:none;margin-left:-20px;border:1.5px dashed var(--line);border-radius:10px;padding:5px 10px}
.nl{margin:4px 0;padding-left:20px}.nl li{margin:6px 0}
.ev{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.ev:last-of-type{border-bottom:0}
.evd{flex:none;width:58px;text-align:center;background:var(--soft);border-radius:10px;padding:6px 0;align-self:flex-start}.evd b{display:block;font-size:19px}.evd span{font-size:12px;color:var(--mut)}
.evb{flex:1}.wk{padding:8px 0;border-bottom:1px solid var(--line)}.wk:last-child{border-bottom:0}
.wkc{margin-bottom:10px}.chip.b{background:light-dark(#e6ecff,#1c2850);color:light-dark(#2f4fb5,#9fb4ff)}
.ibox label{display:block;margin:6px 0;font-size:13.5px;color:var(--mut)}.ibox label input{display:block;margin-top:2px;color:var(--ink)}.ibox .row label{flex:1}
.foot{margin-top:20px}
@media (max-width:700px){.ev{gap:8px}.evd{width:50px}.big{font-size:22px}}

.tabs .cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:rgba(255,255,255,.22);font-size:12px;text-align:center}.tabs a[aria-current=page] .cnt{background:var(--soft)}
.hbtn{cursor:pointer;font:inherit;font-size:13px}
.chip.b{background:light-dark(#e6ecff,#1c2850);color:light-dark(#2f4fb5,#9fb4ff)}
.warn{color:var(--red)}
.tb{margin-bottom:10px}.tb .q{flex:1;min-width:180px}
.pc{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--scrub);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.pc.warn{border-left-color:var(--red);color:inherit}.pc.ed{border-left-color:var(--amb)}
.ph{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.bed{font:800 18px/1.2 Figtree,"Noto Sans TC",sans-serif}
.sec{margin-top:8px}.sec h4{margin:0 0 2px;font-size:12.5px;color:var(--mut);font-weight:700}
.sec.plan{background:var(--soft);border-radius:10px;padding:6px 10px}
.txt{white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.pa{margin-top:8px;gap:6px}
textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card);color:var(--ink);resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px;margin-top:6px}
label.f{display:block;font-size:13px;color:var(--mut)}label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:2px;color:var(--ink)}
.cmp{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:6px}.cmp input,.cmp select{width:100%}
.blank{border:1.5px dashed var(--line);border-radius:12px;padding:10px;margin-top:10px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;align-items:start}.vcard{margin:0}
.vi{border-top:1px solid var(--line);padding:8px 0}.vi:first-of-type{border-top:0}
.up{border-top:1px solid var(--line);padding:8px 0}
details>summary{cursor:pointer;min-height:32px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:10000;font-size:14px}
@media (max-width:700px){.pc{padding:10px 12px}.btn.s{min-height:36px}}
</style>
</head>
<body>
<header><div class="hrow"><div><h1>📝 泌尿科交班</h1><div class="sub" id="sub"></div></div><div class="hside"><span class="sub" id="sync"></span><span class="hside" id="tools"></span></div></div>
<nav class="tabs" id="tabs"></nav></header>
<main id="app"><p class="note">載入中…</p></main>
<script>
{
/* 泌尿科交班網站（handoff.html）。
   病人資料（姓名、病歷號、病情）只透過 Apps Script 的 action:'ho' 讀寫，每次都要交班密碼（指令碼屬性 HO_PASS）；
   這一頁不把病人資料存進 localStorage／同步資料，只放記憶體。
   - 黃部長住院：讀寫 Google 文件交班單「目前住院中」表格（7 欄），出院＝存一份到出院名單再刪列
   - 其他主治／出院／特殊個案：存在試算表隱藏的「交班資料」工作表（kind: vs／dc／sp）
   公開可讀的資料只用 common/people、config/main（主治名單）。 */
const SYNC_URL='https://script.google.com/macros/s/AKfycbyW-2Q_et8fXF4M45GVlxj8fJuCbRhTixBEg7UWA-xCku2AVWGCuvFE9M_W0WJoKayvAg/exec';
const DOC_URL='https://docs.google.com/document/d/1MUwbZVat96vpyil2ahjP6lIv-NzW_MHbOC99EXTx7Yk/edit';
const LS={get(k){try{return JSON.parse(localStorage.getItem('or:'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('or:'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('or:'+k)}catch(e){}}};
let gs=LS.get('gsync');if(!gs||!gs.url)gs={url:SYNC_URL,token:'',on:true};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const DOW='日一二三四五六';const md=s=>s?`${+s.slice(5,7)}/${+s.slice(8)}（${DOW[new Date(s+'T00:00:00').getDay()]}）`:'';
const today=iso(new Date()),tmr=addD(today,1);
const hm=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const L=s=>String(s||'').replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);
const nid=k=>k+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const TOP='黃冠華';
const TAGS=['Critical','術後','待手術','會診','其他'];
const COLS=['床號／姓名／病歷號','Past history','Present illness','Drain','Treatment','Exam, lab','Plan'];

let pass=sessionStorage.getItem('hopass')||LS.get('hopass')||'';
let me=LS.get('home')||'';
let S={doc:null,docErr:'',items:[],at:0,err:'',loading:false,vs:[]},busy=0;
const OPEN=new Set(),EDIT=new Set();let allOpen=false,vsCrit=false,dcAll=false,addHo=false;
const page=()=>{const p=(location.hash||'#huang').slice(1);return ['huang','vs','dc','sp'].includes(p)?p:'huang'};

async function api(op,extra){const r=await fetch(gs.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'ho',pass,op,...(extra||{})})});
 let j;try{j=await r.json()}catch(e){throw new Error('old')}if(!j.ok)throw new Error(j.err||'fail');if(j.value==null)throw new Error('old');return j.value}
const apply=v=>{if('doc' in v&&v.doc)S.doc=v.doc;if('docErr' in v)S.docErr=v.docErr;if(v.items)S.items=v.items;S.at=v.at||Date.now()};
async function load(force){if(!pass){render();return}S.loading=true;hdr();try{apply(await api('load',{force:!!force}));S.err=''}catch(e){S.err=e.message;if(e.message==='badpass'){pass='';sessionStorage.removeItem('hopass');LS.del('hopass')}}S.loading=false;render()}
async function loadVS(){try{const q=gs.url+(gs.url.includes('?')?'&':'?')+'keys='+encodeURIComponent('common/people,config/main')+'&token='+encodeURIComponent(gs.token||'');const j=await (await fetch(q)).json();const v=(j&&j.value)||{};
 const P=((v['common/people']||{}).people||[]).filter(p=>p.role==='VS'&&p.on!==false).map(p=>p.n);const C=(((v['config/main']||{}).cfg||{}).sur||[]).map(x=>x.n);
 S.vs=[...new Set([...(P.length?P:C)])].filter(n=>n&&n!==TOP);render()}catch(e){}}

/* ---------- 共用顯示 ---------- */
const pid=c=>{const l=L(c[0]);const mrn=l.find(x=>/^\d{6,}$/.test(x))||'';const rest=l.filter(x=>x!==mrn);return{bed:rest[0]||'',name:rest.slice(1).join(' '),mrn}};
const key=c=>{const p=pid(c);return p.mrn||(p.bed+'|'+p.name)};
const opDate=o=>{const [m,d]=o.md.split('/').map(Number);const y=+today.slice(0,4),cm=+today.slice(5,7);let yy=y;if(m-cm>6)yy=y-1;else if(cm-m>6)yy=y+1;return `${yy}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`};
const nextOp=r=>(r.ops||[]).map(o=>({...o,date:opDate(o)})).filter(o=>o.date>=today).sort((a,b)=>a.date.localeCompare(b.date))[0];
const opTxt=o=>`${+o.date.slice(5,7)}/${+o.date.slice(8)} ${o.op}${o.slot!=null?(o.slot===0?' 08:30':' TF'+o.slot):o.time?' '+o.time:''}`;
const vals=f=>[f.psa&&'PSA '+f.psa,f.tpv&&'TPV '+f.tpv,f.gs&&'GS '+f.gs,f.pirads&&'PI-RADS '+f.pirads,f.ct,f.cr&&`W ${f.wbc||'-'} H ${f.hb||'-'} C ${f.cr}${f.lab?' ('+f.lab+')':''}`,f.ua&&'UA '+f.ua,f.echo&&'心超 '+f.echo,f.pft&&'肺功 '+f.pft,f.iief&&'IIEF '+f.iief].filter(Boolean);
const warns=f=>[f.hold||(f.ac?'抗凝：'+f.ac:''),f.uc&&'U/C '+f.uc].filter(Boolean);
const txt=s=>`<div class="txt">${esc(String(s||'').replace(/\r/g,'').trim())}</div>`;
const sbox=(s,t)=>`data-s="${esc(String(s).toLowerCase())}"`;
function search(id,ph){return `<input type="search" class="q" data-q="${id}" placeholder="${ph||'搜尋姓名、病歷號、床號、診斷'}" aria-label="搜尋">`}
function fval(box){const o={};box.querySelectorAll('[name]').forEach(el=>o[el.name]=el.type==='checkbox'?el.checked:el.value.trim());return o}
const vsOpts=(sel,blank)=>`${blank?`<option value="">${blank}</option>`:''}${[TOP,...S.vs,'其他／會診'].map(n=>`<option ${n===sel?'selected':''}>${esc(n)}</option>`).join('')}`;
const nm=n=>n===TOP?'黃冠華部長':n;

/* ---------- 登入 ---------- */
function login(){const e=S.err;return `<section class="card" style="max-width:460px;margin:20px auto"><h2>🔒 輸入交班密碼</h2>
 <p class="note">交班有病人姓名與病歷號，每次讀寫都要密碼。密碼請向總醫師詢問，不要貼在群組。</p>
 ${e==='badpass'?'<p class="warn">密碼不對，請再試一次。</p>':''}${e==='nopass'?'<p class="warn">管理者還沒設定交班密碼：Apps Script →「專案設定」→「指令碼屬性」新增 <b>HO_PASS</b>。</p>':''}${e==='old'?'<p class="warn">Apps Script 還沒更新到有交班功能的版本，請稍後再試。</p>':''}
 <div class="row"><input type="password" id="pw" autocomplete="current-password" placeholder="交班密碼" style="flex:1"><button class="btn p" data-act="login">進入</button></div>
 <label class="row" style="margin-top:8px;gap:6px"><input type="checkbox" id="pwr" style="min-height:0"> 記住這台裝置（個人手機才勾）</label></section>`}

/* ---------- 黃部長住院 ---------- */
function hoForm(c,k){return `<div class="fgrid" data-form="${esc(k)}">${COLS.map((t,j)=>`<label class="f">${t}<textarea name="c${j}" rows="${j===0?3:j===4||j===5||j===2?5:3}">${esc(c[j]||'')}</textarea></label>`).join('')}</div>`}
function pcard(r){const c=r.c,p=pid(c),k=key(c),op=nextOp(r),w=warns(r.f||{}),v=vals(r.f||{}),open=allOpen||OPEN.has(k),ed=EDIT.has(k);
 const opc=op?`<span class="chip ${op.date===today?'r':op.date===tmr?'a':'b'}">🔪 ${op.date===today?'今天 ':op.date===tmr?'明天 ':''}${esc(opTxt(op))}</span>`:'';
 if(ed)return `<div class="pc ed" ${sbox(c.join(' '))}><div class="ph"><b class="bed">${esc(p.bed||'新病人')}</b> ${esc(p.name)}</div>${hoForm(c,k)}
  <div class="row" style="margin-top:8px"><button class="btn p" data-act="hosave" data-k="${esc(k)}">儲存到交班單</button><button class="btn" data-act="hocancel" data-k="${esc(k)}">取消</button><span class="note">只會改有變動的欄位；該格原本的粗體等格式會清掉</span></div></div>`;
 const sec=(j,cls)=>String(c[j]||'').trim()?`<div class="sec ${cls||''}"><h4>${COLS[j]}</h4>${txt(c[j])}</div>`:'';
