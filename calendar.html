<script>/* 安裝版（加到主畫面）重新打開時回到「這個 App 的網站」：例如在刀房調度板 App 裡點到科務入口，退出重進會回到調度板；退出時本來就在調度板就不動。
  App 從主畫面圖示打開時網址帶 ?source=pwa（manifest 的 start_url）→ 記下這個 App 的網站（or:pwaHome）。
  之後若是「新的一次開啟」（sessionStorage 是空的，iOS 會直接開回上次的頁面）或離開超過 10 分鐘再回來，而目前不在那個網站，就轉回去。
  同一次使用中點來點去不受影響；行事曆（calendar.html）算科務入口的一部分。所有網站的 <head> 都有這一段，要一起改。 */
(function(){try{var st=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;if(!st||window.OR_HOST==='gas'||location.protocol==='file:')return;
var site=function(p){return p.replace(/(index|calendar)\.html$/,function(m,a){return a==='calendar'?'hub.html':''})},here=site(location.pathname),L=localStorage,S=sessionStorage,K='or:pwaHome',go=function(h){location.replace(h+'?source=pwa')};
if(/[?&]source=pwa(&|$)/.test(location.search))L.setItem(K,here);
else if(!S.getItem('or:pwaSess')){var h=L.getItem(K);if(h&&h!==here){S.setItem('or:pwaSess','1');go(h);return}}
S.setItem('or:pwaSess','1');
var hid=0;document.addEventListener('visibilitychange',function(){if(document.hidden){hid=Date.now();return}var h=L.getItem(K);if(hid&&Date.now()-hid>6e5&&h&&h!==site(location.pathname))go(h);hid=0});
}catch(e){}})();</script>

<header><div class="hrow"><div><h1>泌尿科 科務入口</h1><div class="sub" id="sub"></div></div><div class="hside"><span class="sub" id="sync"></span><span class="hside" id="tools"></span></div></div>

<script src="auth.js?v=1"></script>
<script>
{
/* 泌尿科科內行事曆（calendar.html）。與刀房調度板、科務入口、晨會共用同一個 Apps Script 同步網址。
   讀：common/people（人員名冊）、config/main（休假 → 自動標「休假」）、meeting/plan（晨會網站的「重要會議」與晨會議程項目）、meeting/drive（晨會議程標題）
   讀寫：calendar/events {ts,
     events:[{id,title,cat,date,end,time,tend,place,note,aud,ppl:[人員id],ts,del}]     單次活動
     rules:[{id,title,cat,freq,dow,from,until,time,tend,place,note,aud,ppl,on,ts,del}]  例行（freq：w 每週／2w 隔週／m1–m4 每月第幾個／ml 每月最後一個）
     skip:{'規則id@日期':1}                     例行的某一次取消
     att:{'場次鍵':{人員id:'y'|'n'|'m'}}       出席：y 參加／n 不參加／m 未定（休假由調度板自動判斷，不存）
     mcat:{晨會會議id:分類}, hideM:{晨會會議id:1}, hideO:{截圖辨識的場次鍵:1}}  晨會網站匯入的會議：改分類／不顯示
   讀：meeting/cal（Apps Script 用 AI 辨識的每月開會行程 PDF、重要醫學會日期與投稿截止；見 Code.gs meetingCalRead）
   場次鍵＝來源:id@日期（e＝單次、r＝例行、m＝晨會網站的重要會議、o＝晨會簡報截圖辨識、a＝開會行程 PDF／學會），超過 180 天前的出席紀錄存檔時自動刪掉（試算表單格 5 萬字上限）。
   只放會議名稱、時間、地點與出席，不放病人資料。 */
const SYNC_URL='https://script.google.com/macros/s/AKfycbyW-2Q_et8fXF4M45GVlxj8fJuCbRhTixBEg7UWA-xCku2AVWGCuvFE9M_W0WJoKayvAg/exec';
const KEY='calendar/events';
const LS={get(k){try{return JSON.parse(localStorage.getItem('or:'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('or:'+k,JSON.stringify(v))}catch(e){}}};
let gs=LS.get('gsync');if(!gs||!gs.url)gs={url:SYNC_URL,token:'',on:true};
const on=()=>gs.on&&gs.url;
const AQ=()=>window.AUTH?AUTH.q():'',AB=o=>window.AUTH?AUTH.body(o):o,APREF=()=>window.AUTH?AUTH.prefs():{};
const q_=k=>gs.url+(gs.url.includes('?')?'&':'?')+k+'&token='+encodeURIComponent(gs.token||'')+AQ();
async function get(key){const r=await fetch(q_('key='+encodeURIComponent(key)));const j=await r.json();if(!j.ok)throw new Error(j.err||'fail');return j.value}
async function getMany(keys){try{const r=await fetch(q_('keys='+encodeURIComponent(keys.join(','))));const j=await r.json();if(j.ok&&j.value&&typeof j.value==='object'&&!Array.isArray(j.value))return keys.map(k=>({status:'fulfilled',value:j.value[k]??null}))}catch(e){}return Promise.allSettled(keys.map(get))}
async function set(key,value){const r=await fetch(gs.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(AB({token:gs.token||'',key,value}))});const j=await r.json();if(!j.ok)throw new Error(j.err||'fail')}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const addM=(s,n)=>{const d=new Date(s.slice(0,7)+'-01T00:00:00');d.setMonth(d.getMonth()+n);return iso(d)};
const dow=s=>new Date(s+'T00:00:00').getDay();
const DOW='日一二三四五六';
const md=s=>s?`${+s.slice(5,7)}/${+s.slice(8)}（${DOW[dow(s)]}）`:'';
const days=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const today=iso(new Date());
const until=d=>{const n=days(today,d);return n===0?'今天':n===1?'明天':n===2?'後天':n>0?`${n} 天後`:`${-n} 天前`};
const nid=p=>(p||'c')+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

/* ---------- 分類 ---------- */
const CATS=[['mtg','晨會','#0e7490'],['cc','癌症討論會','#7c3aed'],['sem','Seminar／Journal','#2563eb'],['conf','學會／研討會','#c77d00'],['dept','科會／行政','#e5484d'],['teach','教學／考試','#1f8a5b'],['social','活動／聚餐','#db2777'],['other','其他','#64748b']];
const CN=Object.fromEntries(CATS.map(x=>[x[0],x[1]])),CC=Object.fromEntries(CATS.map(x=>[x[0],x[2]]));

const FREQ=[['w','每週'],['2w','隔週'],['m1','每月第 1 個'],['m2','每月第 2 個'],['m3','每月第 3 個'],['m4','每月第 4 個'],['ml','每月最後一個']];

/* 預設例行：晨會週二、癌症討論會週四，都是 07:25 在 554 */

 {id:'r_cc',title:'GU 癌症討論會',cat:'cc',freq:'w',dow:4,from:'2026-01-01',time:'07:25',tend:'',place:'554',note:'Combined Conference: GU & Radiology & Nephrology',aud:'all',on:true}];

let S={people:null,cfg:null,mp:null,md:null,cal:null,err:'',loading:true},saving=0;

 /* 舊資料的預設例行還沒填時間地點 → 補上 */
 c.rules.forEach(r=>{const d=DEF_RULES.find(x=>x.id===r.id);if(d&&!r.time&&!r.place){r.time=d.time;r.place=d.place}});return c};

/* ---------- 人員 ---------- */

const invited=o=>{const L=PPL();const base=o.aud==='VS'?L.filter(p=>p.role==='VS'):o.aud==='R'?L.filter(p=>p.role==='R'||p.role==='F'):o.aud==='pick'?L.filter(p=>(o.ppl||[]).includes(p.id)):L;
 const A=CAL().att[o.key]||{};return L.filter(p=>base.includes(p)||A[p.id])};
/* 休假：調度板設定 config/main 的 leaves（住院醫師 id）／vsLeaves（主治名字） */
function leaveOf(p,d){const c=S.cfg||{};
 if(p.role==='VS'){const l=(c.vsLeaves||[]).find(l=>(l.s===p.n||l.s===p.full)&&l.from<=d&&(l.to||l.from)>=d);return l?'休假':''}
 const l=(c.leaves||[]).find(l=>l.r===p.id&&l.from<=d&&(l.to||l.from)>=d);return l?(l.type||'休假')+(l.half==='am'?'・上午':l.half==='pm'?'・下午':''):''}
const ST={y:['✓','參加'],n:['✗','不參加'],m:['?','未定'],L:['休','休假'],'':['·','未回覆']};
const stRaw=(o,p)=>(CAL().att[o.key]||{})[p.id]||'';
const stOf=(o,p)=>stRaw(o,p)||(leaveOf(p,o.date)?'L':'');
function counts(o){const c={y:0,n:0,m:0,L:0,'':0},L=invited(o);L.forEach(p=>c[stOf(o,p)]++);c.tot=L.length;return c}
const cntHtml=o=>{const c=counts(o);if(!c.tot)return'';return `<span class="cnt" title="參加／不參加／未定／休假／未回覆">${c.y?`<span class="y">✓ ${c.y}</span>`:''}${c.n?`<span class="n">✗ ${c.n}</span>`:''}${c.m?`<span class="m">? ${c.m}</span>`:''}${c.L?`<span class="L">休 ${c.L}</span>`:''}${c['']?`<span>未回 ${c['']}</span>`:''}</span>`};
const meP=()=>PPL().find(p=>p.id===me);
const canSet=pid=>edit||(me&&pid===me);
const rsvp=(o,p,short)=>{const s=stRaw(o,p),ok=canSet(p.id);return `<span class="rs" ${ok?'':'aria-disabled="true" title="按右上「✏️ 編輯」才能改別人的；改自己的請先在右上選「我是」"'}>${['y','m','n'].map(k=>`<button type="button" class="${s===k?'on '+k:''}" ${ok?`data-act="att" data-k="${esc(o.key)}" data-p="${esc(p.id)}" data-s="${k}"`:''} aria-pressed="${s===k}">${ST[k][0]}${short?'':' '+ST[k][1]}</button>`).join('')}</span>`};

/* ---------- 場次 ---------- */
const evEnd=e=>e.end&&e.end>e.date?e.end:e.date;
function ruleHit(r,d){if(dow(d)!==+r.dow||(r.from&&d<r.from)||(r.until&&d>r.until))return false;
 if(r.freq==='w')return true;if(r.freq==='2w')return((days(r.from||'2026-01-04',d)/7)%2+2)%2===0;if(r.freq==='ml')return addD(d,7).slice(5,7)!==d.slice(5,7);
 return Math.ceil(+d.slice(8)/7)===+String(r.freq).slice(1)}
function occs(a,b,all){const C=CAL(),out=[];
 C.events.filter(e=>!e.del&&e.date&&e.date<=b&&evEnd(e)>=a).forEach(e=>out.push({...e,key:'e:'+e.id+'@'+e.date,src:'e'}));
 C.rules.filter(r=>!r.del&&r.on!==false).forEach(r=>{let d=a;if(r.from&&d<r.from)d=r.from;for(let i=0;d<=b&&i<400;i++,d=addD(d,1))if(ruleHit(r,d)&&!C.skip[r.id+'@'+d])out.push({...r,date:d,end:'',key:'r:'+r.id+'@'+d,src:'r',rule:r})});
 ((S.mp&&S.mp.events)||[]).filter(e=>e&&!e.del&&e.date&&e.date<=b&&evEnd(e)>=a&&(all||!C.hideM[e.id])).forEach(e=>out.push({id:e.id,title:e.title,date:e.date,end:e.end||'',time:e.time||'',tend:'',place:e.place||'',note:(e.note||'')+(e.pre?(e.note?'；':'')+'需在晨會預報'+(e.preWho?'（'+e.preWho+'）':''):''),cat:C.mcat[e.id]||mDefCat(e.title),aud:'all',key:'m:'+e.id+'@'+e.date,src:'m',hidden:!!C.hideM[e.id]}));
 /* 晨會簡報截圖辨識（Apps Script meetingScan 的 weeks[].img）：同一天已經有單次活動或晨會網站的會議就不重複 */
 ((S.md&&S.md.weeks)||[]).forEach(w=>(w.img||[]).forEach(x=>{if(!x||!x.d||!x.title||x.d>b||(x.end||x.d)<a)return;const key='o:'+x.title.replace(/@/g,'').slice(0,30)+'@'+x.d;
  if((C.hideO[key]&&!all)||out.some(o=>(o.src==='e'||o.src==='m')&&o.date===x.d))return;
  out.push({id:key,title:x.title,date:x.d,end:x.end||'',time:x.t||'',tend:'',place:x.place||'',note:'',cat:mDefCat(x.title),aud:'all',key,src:'o',wk:w.d,hidden:!!C.hideO[key]})}));
 /* 開會行程 PDF、學會日期（meeting/cal）：同一天、時間差 40 分鐘內的例行會議 → 併進那一場（顯示行程表的名稱）；同一天名稱相近的活動 → 不重複 */
 const nrm=t=>String(t||'').toLowerCase().replace(/[\s\-–+＋、,，.()（）]/g,''),near=(a,b)=>{const x=nrm(a),y=nrm(b);return x&&y&&(x.includes(y)||y.includes(x)||(x.length>=4&&y.length>=4&&x.slice(0,4)===y.slice(0,4)))};
 const mins=t=>{const m=String(t||'').match(/^(\d\d):(\d\d)/);return m?+m[1]*60+ +m[2]:null};
 ((S.mc&&S.mc.items)||[]).forEach(x=>{if(!x||!x.d||!x.title||x.d>b||(x.end||x.d)<a)return;const key='a:'+x.title.replace(/@/g,'').slice(0,30)+'@'+x.d;
  if(C.hideO[key]&&!all)return;
  const r=x.t&&out.find(o=>o.src==='r'&&o.date===x.d&&mins(o.time)!=null&&Math.abs(mins(o.time)-mins(x.t))<=40);
  if(r){(r.sub=r.sub||[]).push(x.title+(x.who?'（'+x.who+'）':''));if(!r.place&&x.place)r.place=x.place;return}
  if(out.some(o=>o.src!=='r'&&o.date===x.d&&near(o.title,x.title)))return;
  const cat=x.kind==='醫學會'||x.kind==='院際會議'||x.kind==='投稿截止'?'conf':x.kind==='課程'?'teach':(g=>g==='other'?'teach':g)(guessCat(x.title));
  out.push({id:key,title:x.title,date:x.d,end:x.end||'',time:x.t||'',tend:x.tend||'',place:x.place||'',note:[x.who,x.note].filter(Boolean).join('；'),cat,aud:'all',key,src:'a',kind:x.kind,srcL:x.src||'',url:x.url||'',sk:x.sk,hidden:!!C.hideO[key]})});
 return out.filter(o=>all||!hideCats.includes(o.cat)).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:(x.time||'99')<(y.time||'99')?-1:(x.time||'99')>(y.time||'99')?1:0)}
const mDefCat=t=>{const g=guessCat(t);return g==='other'?'conf':g};
const findOcc=k=>{const d=k.slice(k.lastIndexOf('@')+1);return occs(d,d,true).find(o=>o.key===k)};
const tmTxt=o=>o.time?o.time+(o.tend?'–'+o.tend:''):(o.end&&o.end>o.date?'多日':'');
const dateTxt=o=>md(o.date)+(o.end&&o.end>o.date?` ～ ${md(o.end)}`:'');
const srcTxt=o=>o.src==='a'?`🤖 ${o.srcL}${/內建/.test(o.srcL)?'':'（AI 辨識，文字可能有誤）'}`:o.src==='r'?`🔁 例行：${freqTxt(o.rule)}${o.sub?'；行程表：'+o.sub.join('、'):''}`:o.src==='m'?'🕣 來自晨會網站「重要會議」':o.src==='o'?`🔍 從 ${md(o.wk)} 晨會簡報的截圖辨識，文字可能有誤，請確認`:'';
/* 晨會議程：同一天晨會網站的議程標題＋規劃項目 */
function agendaOf(d){const w=((S.md&&S.md.weeks)||[]).find(x=>x.d===d),its=((S.mp&&S.mp.items)||[]).filter(x=>x&&!x.del&&x.d===d).map(x=>x.title+(x.who?' - '+x.who:''));
 const L=[...((w&&w.outline)||[])];its.forEach(t=>{if(!L.some(x=>x.includes(t.split(' - ')[0])))L.push(t)});return L}

/* ---------- 共用畫面片段 ---------- */
const catChip=c=>`<span class="chip" style="background:color-mix(in srgb,${CC[c]||'#888'} 16%,transparent);color:${CC[c]||'#888'}">${esc(CN[c]||'其他')}</span>`;
function evCard(o,opt){opt=opt||{};const p=meP(),inv=p&&invited(o).includes(p);
 return `<div class="ev${o.src==='o'?' ocr':''}" style="--c:${CC[o.cat]||'#888'}" data-act="open" data-k="${esc(o.key)}" role="button" tabindex="0">
  ${opt.noTime?'':`<div class="tm">${esc(tmTxt(o))||'<span class="note">—</span>'}</div>`}
  <div class="bd">${opt.noTime&&tmTxt(o)?`<span class="tm">${esc(tmTxt(o))}</span> `:''}<b>${esc(o.title)}</b> ${catChip(o.cat)}${o.end&&o.end>o.date?` <span class="note">${esc(dateTxt(o))}</span>`:''}
   <div class="meta">${[o.place?'📍 '+esc(o.place):'',o.src==='r'?'🔁 例行':'',o.src==='m'?'🕣 晨會網站':'',o.src==='o'?'🔍 截圖辨識・待確認':'',o.src==='a'?'🤖 '+esc(o.kind||'行程表'):'',o.sub?'📋 '+o.sub.map(esc).join('、'):''].filter(Boolean).join('・')}</div>
   ${o.cat==='mtg'&&agendaOf(o.date).length&&!opt.noAgenda?`<div class="meta">議程 ${agendaOf(o.date).length} 項</div>`:''}</div>
  <div class="side">${cntHtml(o)}${inv?rsvp(o,p,true):''}</div></div>`}
const catBar=()=>`<div class="cats">${CATS.map(([k,n,c])=>`<button class="cat ${hideCats.includes(k)?'off':''}" style="--c:${c}" data-act="cat" data-c="${k}" aria-pressed="${!hideCats.includes(k)}">${n}</button>`).join('')}</div>`;
function navBar(pg){let ttl='';
 if(pg==='month')ttl=`${cur.slice(0,4)} 年 ${+cur.slice(5,7)} 月`;
 else if(pg==='week'){const a=addD(cur,-dow(cur)),b=addD(a,6);ttl=`${+a.slice(5,7)}/${+a.slice(8)} – ${+b.slice(5,7)}/${+b.slice(8)}`}
 else if(pg==='list'||pg==='att'){const b=addD(cur,pg==='att'?55:41);ttl=`${+cur.slice(5,7)}/${+cur.slice(8)} 起 ${pg==='att'?8:6} 週`}
 return `<div class="bar"><div class="seg"><button data-act="nav" data-n="-1" aria-label="上一頁">‹</button><button data-act="nav" data-n="0">今天</button><button data-act="nav" data-n="1" aria-label="下一頁">›</button></div><span class="ttl">${ttl}</span>
  <span style="flex:1"></span>${pg==='list'||pg==='att'?`<label class="note row" style="gap:4px"><input type="checkbox" data-ch="noRoutine" ${noRoutine?'checked':''} style="min-height:0">隱藏每週例行</label>`:''}
  <button class="btn s" data-act="ics" title="把這個畫面的活動加到 Google 日曆／iPhone／Outlook">⬇ 加入日曆（.ics）</button>${edit?`<button class="btn s p" data-act="new" data-d="${pg==='month'?sel:cur}">＋ 新增活動</button>`:''}</div>`}
function rangeOf(pg){if(pg==='month'){const a=cur.slice(0,7)+'-01';return[a,addD(addM(a,1),-1)]}if(pg==='week'){const a=addD(cur,-dow(cur));return[a,addD(a,6)]}if(pg==='att')return[cur,addD(cur,55)];return[cur,addD(cur,41)]}

/* ---------- 月曆 ---------- */
function monthPage(){const m0=cur.slice(0,7)+'-01',start=addD(m0,-dow(m0)),last=addD(addM(m0,1),-1),end=addD(last,6-dow(last));
 const O=occs(start,end),cells=[];
 for(let d=start;d<=end;d=addD(d,1)){const L=O.filter(o=>o.date<=d&&evEnd(o)>=d),p=meP(),max=4;
  cells.push(`<div class="mc ${d.slice(0,7)!==cur.slice(0,7)?'out':''} ${d===today?'td':''} ${d===sel?'sel':''}" data-act="day" data-d="${d}"><span class="dn ${dow(d)%6===0?'we':''}">${+d.slice(8)}</span>
   ${L.slice(0,max).map(o=>{const s=p&&invited(o).includes(p)?stOf(o,p):'';return `<button class="pill${o.src==='o'?' ocr':''}" style="--c:${CC[o.cat]||'#888'}" data-act="open" data-k="${esc(o.key)}" title="${esc(tmTxt(o)+' '+o.title+(o.place?' @'+o.place:''))}">${s?ST[s][0]+' ':''}${o.time&&o.date===d?`<span class="tm">${esc(o.time)}</span>`:''}${esc(o.title)}</button>`}).join('')}
   ${L.length>max?`<span class="more">還有 ${L.length-max} 項</span>`:''}</div>`)}
 const SL=O.filter(o=>o.date<=sel&&evEnd(o)>=sel);
 return navBar('month')+catBar()+`<div class="mgrid">${[...DOW].map((x,i)=>`<div class="dh ${i%6===0?'we':''}">${x}</div>`).join('')}${cells.join('')}</div>

  ${SL.length?SL.map(o=>evCard(o)).join(''):'<p class="note">這天沒有活動。</p>'}</section>`}

/* ---------- 週 ---------- */

 if(!L.length)return navBar('att')+'<p class="note">人員名冊還沒有人（在科務入口「人員名冊」新增）。</p>';
 const gfirst=new Set(GRP.map(([r])=>(L.find(p=>p.role===r)||{}).id).filter(Boolean));

  ${L.map(p=>{const s=inv.has(p.id)?stOf(o,p):'x';if(s==='y')tot[p.id]++;const ok=inv.has(p.id)&&canSet(p.id)&&s!=='L';return `<td class="${gfirst.has(p.id)?'grp ':''}${ok?'cl':''}" ${ok?`data-act="cyc" data-k="${esc(o.key)}" data-p="${esc(p.id)}"`:''} title="${esc(pname(p)+'：'+(s==='x'?'不在邀請名單':s==='L'?leaveOf(p,o.date):ST[s][1]))}"><span class="st ${s}">${s==='x'?'·':ST[s][0]}</span></td>`}).join('')}</tr>`}).join('');

/* 解析貼上的文字 */
const fixY=(m,d,y)=>{if(y)return`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;let s=`${today.slice(0,4)}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;if(days(today,s)<-60)s=(+today.slice(0,4)+1)+s.slice(4);return s};
function parseText(t){const out=[];String(t||'').replace(/\r/g,'').split('\n').forEach(line=>{let s=line.replace(/^[\s\-•*·・●▪︎\d]+[.、)）]\s+/,'').trim();if(!s)return;
 const m=s.match(/^(?:(\d{4})[\/\-.年])?(\d{1,2})[\/\-.月](\d{1,2})日?\s*(?:[(（][一二三四五六日][)）])?\s*(?:[~～\-–至到]\s*(?:(\d{1,2})[\/\-.月])?(\d{1,2})日?\s*(?:[(（][一二三四五六日][)）])?)?/);if(!m)return;
 const mo=+m[2],dd=+m[3];if(mo<1||mo>12||dd<1||dd>31)return;const date=fixY(mo,dd,m[1]);let end='';
 if(m[5]){end=fixY(m[4]?+m[4]:mo,+m[5],m[1]);if(end<date)end=fixY(m[4]?+m[4]:mo,+m[5],+date.slice(0,4)+1)}
 s=s.slice(m[0].length).trim();let time='',tend='';const tm=s.match(/^(?:(上午|早上|中午|下午|晚上)\s*)?(\d{1,2})[:：](\d{2})(?:\s*[~～\-–到]\s*(\d{1,2})[:：](\d{2}))?/);
 if(tm){let h=+tm[2];if(/下午|晚上/.test(tm[1]||'')&&h<12)h+=12;time=String(h).padStart(2,'0')+':'+tm[3];if(tm[4]){let h2=+tm[4];if(h2<h&&h2<12)h2+=12;tend=String(h2).padStart(2,'0')+':'+tm[5]}s=s.slice(tm[0].length).trim()}
 let place='';const pm=s.match(/\s*[@＠]\s*(.+)$/)||s.match(/\s+(?:地點|於)[:：]?\s*(.+)$/);if(pm){place=pm[1].trim();s=s.slice(0,pm.index).trim()}
 const title=s.replace(/^[：:,，\-–\s]+/,'').trim();if(!title)return;out.push({title,date,end:end&&end>date?end:'',time,tend,place,cat:guessCat(title)})});return out}
/* 解析 .ics（Google 日曆／Outlook 匯出）。只取標題、時間、地點；不匯入說明欄。 */
function parseIcs(t){const L=String(t||'').replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,'').split(/\r?\n/),out=[];let e=null;
 const un=s=>s.replace(/\\n/gi,' ').replace(/\\([,;\\])/g,'$1');
 const dt=(v,p)=>{const m=v.match(/^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)\d\d(Z)?)?/);if(!m)return null;
  if(!m[4])return{d:`${m[1]}-${m[2]}-${m[3]}`,t:'',allday:true};
  let D=new Date(Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5]));if(!m[6])return{d:`${m[1]}-${m[2]}-${m[3]}`,t:`${m[4]}:${m[5]}`};
  D=new Date(D.getTime()+8*36e5);const s=D.toISOString();return{d:s.slice(0,10),t:s.slice(11,16)}};
 L.forEach(l=>{if(l==='BEGIN:VEVENT'){e={};return}if(l==='END:VEVENT'){if(e&&e.s&&e.title&&!/CANCELLED/i.test(e.status||''))out.push(e);e=null;return}if(!e)return;
  const i=l.indexOf(':');if(i<0)return;const k=l.slice(0,i).split(';')[0].toUpperCase(),v=l.slice(i+1);
  if(k==='SUMMARY')e.title=un(v).trim();else if(k==='LOCATION')e.place=un(v).trim();else if(k==='DTSTART')e.s=dt(v);else if(k==='DTEND')e.e=dt(v);else if(k==='RRULE')e.rr=v;else if(k==='STATUS')e.status=v});
 return out.map(x=>{let end='';if(x.e){end=x.e.d;if(x.s.allday)end=addD(end,-1);if(end<=x.s.d)end=''}
  const o={title:x.title,date:x.s.d,end,time:x.s.t||'',tend:x.e&&x.e.t&&!end?x.e.t:'',place:x.place||'',cat:guessCat(x.title)};
  if(x.rr){const R=Object.fromEntries(x.rr.split(';').map(s=>s.split('='))),iv=+(R.INTERVAL||1),bd=R.BYDAY||'';
   if(R.FREQ==='WEEKLY'&&iv<=2&&(!bd||!bd.includes(','))){o.freq=iv===2?'2w':'w';o.dow=dow(o.date)}
   else if(R.FREQ==='MONTHLY'&&/^-?\d?(MO|TU|WE|TH|FR|SA|SU)$/.test(bd)){const n=parseInt(bd)||Math.ceil(+o.date.slice(8)/7);o.freq=n<0?'ml':'m'+Math.min(n,4);o.dow=dow(o.date)}
   if(o.freq){o.from=o.date;o.end='';if(R.UNTIL){const u=dt(R.UNTIL);if(u)o.until=u.d}}}
  return o}).filter(o=>o.freq||evEnd(o)>=addD(today,-31))}
function markDup(L){const C=CAL();L.forEach(x=>{x.dup=x.freq?C.rules.some(r=>!r.del&&r.title===x.title&&+r.dow===+x.dow):C.events.some(e=>!e.del&&e.date===x.date&&e.title===x.title);x.on=!x.dup});return L}

/* ---------- 日曆匯出 ---------- */
const ymd=d=>d.replace(/-/g,'');
const hm=t=>t.replace(':','')+'00';
const plus2=t=>String(Math.min(+t.slice(0,2)+1,23)).padStart(2,'0')+t.slice(2);  // 沒填結束時間：抓 1 小時
function gcal(o){let dates;if(o.time){const te=o.tend||plus2(o.time);dates=ymd(o.date)+'T'+hm(o.time)+'/'+ymd(evEnd(o))+'T'+hm(te)}else dates=ymd(o.date)+'/'+ymd(addD(evEnd(o),1));
 return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(o.title)+'&dates='+dates+'&ctz=Asia/Taipei&details='+encodeURIComponent((o.note||'')+'\n— 泌尿科科內行事曆')+'&location='+encodeURIComponent(o.place||'')}
function icsOf(list){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//uro-or//calendar//ZH','CALSCALE:GREGORIAN','X-WR-TIMEZONE:Asia/Taipei'];
 const tx=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m);
 const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
 list.forEach(o=>{L.push('BEGIN:VEVENT','UID:'+o.key.replace(/[^\w@.-]/g,'_')+'@uro-calendar','DTSTAMP:'+stamp,'SUMMARY:'+tx(o.title));
  if(o.time)L.push('DTSTART;TZID=Asia/Taipei:'+ymd(o.date)+'T'+hm(o.time),'DTEND;TZID=Asia/Taipei:'+ymd(evEnd(o))+'T'+hm(o.tend||plus2(o.time)));
  else L.push('DTSTART;VALUE=DATE:'+ymd(o.date),'DTEND;VALUE=DATE:'+ymd(addD(evEnd(o),1)));
  if(o.place)L.push('LOCATION:'+tx(o.place));if(o.note)L.push('DESCRIPTION:'+tx(o.note));
  L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+tx(o.title),'TRIGGER:'+(o.time?'-P1D':'-PT15H'),'END:VALARM','END:VEVENT')});
 L.push('END:VCALENDAR');return L.join('\r\n')}
function dlIcs(list,name){const b=new Blob([icsOf(list)],{type:'text/calendar;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

function toast(t){const d=document.createElement('div');d.textContent=t;d.setAttribute('role','status');d.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b1830;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:10000;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:90vw;text-align:center';document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}a.remove();return ok}}
document.addEventListener('click',async e=>{const a=e.target.closest&&e.target.closest('[data-share]');if(!a)return;e.preventDefault();e.stopPropagation();
 const url=shareLink(),text=SHARE_T+'（點開後可按「📲 加到主畫面」）';
 if(navigator.share&&/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){try{await navigator.share({title:SHARE_T,text,url});return}catch(x){if(x&&x.name==='AbortError')return}}
 if(await copyText(text+'\n'+url))toast('✓ 已複製連結，貼到 LINE 或訊息就能分享');else prompt('複製這個連結分享給大家：',url)},true);
}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-calv]');if(!b)return;e.preventDefault();location.hash=b.dataset.calv},true);
</script>
