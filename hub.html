  ${L.length?`<ul class="fbl">${L.map(item).join('')}</ul>`:`<p class="note">${fbShow==='done'?'還沒有已解決的回饋。':'沒有待處理的回饋。'}</p>`}</section>
 <section class="card" style="margin-top:14px"><h2>📋 版本紀錄 <small>目前 v${CHANGELOG[0].v}</small></h2>
  ${CHANGELOG.map((c,i)=>`<div class="ver ${i?'':'cur'}"><h3><span class="t">v${c.v}</span>${esc(c.t)} <small class="note">${md(c.d)}・${c.s.map(esc).join('、')}</small></h3><ul>${c.i.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</section>`}

/* ===== 👤 我的帳號（#me）：Google 登入、核可狀態、個人偏好（存在伺服器 user/<email>，各網站共用） ===== */
const START=[['home','首頁'],['cal','行事曆'],['people','人員名冊'],['links','常用連結'],['fb','回饋・更新'],['ho','（泌尿科交班網站）'],['cc','（癌症討論會網站）']];
let meMsg='',meCode='';
function myDay(){const id=APREF().me;if(!id)return '';const p=P().find(x=>x.id===id);if(!p)return '';const c=S.cfg||{},L=(c.duty||{})[today]||[];
 const role={sec:'二線',icu:'ICU',w1:'一線',tot:'總值','':'值班'};const d=L.map(String).filter(x=>x.split(':')[0]===id).map(x=>role[x.split(':')[1]||'']||'值班');
 const lv=(c.leaves||[]).find(l=>l.r===id&&l.from<=today&&(l.to||l.from)>=today);
 return `<dt>👤 ${esc(p.n)}</dt><dd>${d.length?`今晚 <b>${esc(d.join('、'))}</b>`:'今晚沒有值班'}${lv?`・今天休假${lv.type?'（'+esc(lv.type)+'）':''}`:''}</dd>`}
function mePage(){if(!window.AUTH)return '<section class="card"><p>登入元件載入失敗，請重新整理。</p></section>';
 if(!AUTH.on())return '<section class="card"><h2>👤 我的帳號</h2><p class="note">登入功能尚未啟用。</p></section>';
 const m=AUTH.me(),pf=APREF();
 if(!m)return `<section class="card" style="text-align:center"><h2 style="justify-content:center">👤 我的帳號</h2><p>用 Google 帳號登入後，可以：</p><ul style="text-align:left;max-width:420px;margin:0 auto 10px"><li>查看黃部長交班、癌症討論會（限交班單有共用的帳號）</li><li>記住「我是誰」，首頁直接顯示你今晚的值班、行事曆自動選好你</li><li>設定外觀、入口打開時的分頁、調度板預設模式，換手機也一樣</li></ul><button class="btn p" data-alogin>🔑 用 Google 帳號登入</button></section>`;
 const sel=(k,opts,v)=>`<select data-ch="pref" data-k="${k}">${opts.map(([a,b])=>`<option value="${a}" ${String(v||'')===a?'selected':''}>${b}</option>`).join('')}</select>`;
 const ppl=P().filter(p=>p.on!==false).sort((a,b)=>'VSFR'.indexOf(a.role)-'VSFR'.indexOf(b.role)||String(a.n).localeCompare(String(b.n)));
 return `<section class="card"><div class="row" style="gap:14px;align-items:center">${m.pic?`<img src="${esc(m.pic)}" alt="" width="56" height="56" referrerpolicy="no-referrer" style="border-radius:50%">`:'<span style="font-size:40px">👤</span>'}
  <div style="flex:1"><b style="font-size:18px">${esc(AUTH.name())}</b><div class="note">${esc(m.email)}</div>
  <div class="row" style="margin-top:4px;gap:6px">${m.ok?'<span class="chip g">✓ 可看交班單、癌症討論會</span>':'<span class="chip a">交班單、癌症討論會：未開放</span>'}</div></div>
  <button class="btn" data-alogout>換帳號</button><button class="btn" data-act="logout">登出</button></div>
  ${m.ok?'':`<p class="note" style="margin-top:10px">交班單、癌症討論會的權限＝黃部長交班單（Google 文件）的共用對象。請總醫師把交班單共用給 <b>${esc(m.email)}</b>（檢視者即可），約 10 分鐘內生效，再按 <button class="btn s" data-arefresh>重新檢查</button>。</p>`}</section>
 <section class="card" style="margin-top:14px"><h2>個人設定 <small>存在你的帳號，換手機、換電腦登入後都一樣</small></h2>
  <dl class="dl" style="row-gap:10px;align-items:center">
   <dt>顯示名稱</dt><dd><input id="mename" value="${esc(m.name||'')}" placeholder="${esc((m.email||'').split('@')[0])}" style="width:180px"> <button class="btn s" data-act="mename">儲存</button></dd>
   <dt>我是</dt><dd><select data-ch="pref" data-k="me"><option value="">（不指定）</option>${ppl.map(p=>`<option value="${esc(p.id)}" ${pf.me===p.id?'selected':''}>${esc(p.n)}${p.full&&p.full!==p.n?'（'+esc(p.full)+'）':''}・${esc(p.lv||ROLE[p.role]||'')}</option>`).join('')}</select> <span class="note">首頁顯示你今晚的值班、行事曆自動選好你</span></dd>
   <dt>外觀</dt><dd>${sel('theme',[['','跟著手機／電腦'],['light','淺色'],['dark','深色']],pf.theme)}</dd>
   <dt>入口打開時</dt><dd>${sel('start',START,pf.start||'home')}</dd>
   <dt>調度板預設</dt><dd>${sel('orMode',[['','記住上次'],['view','看刀表'],['edit','✏️ 排刀模式']],pf.orMode)}</dd>
  </dl><p class="note">${esc(meMsg)}</p></section>
 <section class="card" style="margin-top:14px"><h2>在主畫面 App 登入 <small>iPhone 主畫面 App 若跳不出 Google 登入</small></h2>
  <p class="note">按下面產生 8 碼登入碼（10 分鐘內有效、只能用一次），在 App 的登入視窗選「用登入碼」輸入即可。</p>
  <div class="row"><button class="btn" data-act="mecode">產生登入碼</button>${meCode?`<b class="t" style="font-size:24px;letter-spacing:3px">${esc(meCode)}</b>`:''}</div></section>`}
document.addEventListener('click',async e=>{const b=e.target.closest&&e.target.closest('[data-act=logout],[data-act=mename],[data-act=mecode]');if(!b||!window.AUTH)return;const k=b.dataset.act;
 if(k==='logout'){await AUTH.logout();if(!AUTH.me())location.hash='#home'}
 if(k==='mename'){try{await AUTH.savePrefs({},$('#mename').value.trim());meMsg='✓ 已儲存'}catch(x){meMsg='儲存失敗：'+x.message}render()}
 if(k==='mecode'){try{meCode=await AUTH.code()}catch(x){meCode='';meMsg='產生失敗，請重新登入'}render()}},true);
document.addEventListener('change',async e=>{const el=e.target;if(el.dataset.ch!=='pref'||!window.AUTH)return;e.stopPropagation();const k=el.dataset.k,v=el.value;
 if(k==='me')LS.set('calMe',v);try{await AUTH.savePrefs({[k]:v});meMsg='✓ 已儲存'}catch(x){meMsg='儲存失敗：'+x.message}render()},true);

function setupCard(){return `<section class="card"><h2>尚未連上同步</h2><p>入口網頁和刀房調度板共用同一個 Google 同步網址。若調度板已經設定好，請先在同一支手機／電腦打開一次<a href="./">刀房調度板</a>，再回來重新整理。</p>
 <div class="row"><input id="u" placeholder="https://script.google.com/macros/s/…/exec" style="flex:1;min-width:260px" value="${esc(gs.url)}"><input id="tk" placeholder="密碼（沒有就留空）" value="${esc(gs.token||'')}" style="width:150px"><button class="btn p" data-act="conn">連線</button></div></section>`}

/* 科務入口分頁列：行事曆（calendar.html）是入口的一頁，用同一個分頁列；癌症討論會、交班、晨會、調度板是獨立網站。
   calendar.html 的 hubTabs() 要跟這裡一致。 */
function hubTabs(pg){return [['home','首頁'],['cal','📆 行事曆'],['people','人員名冊'],['links','常用連結'],['fb','💬 回饋・更新']].concat(window.AUTH&&AUTH.on()?[['me','👤 我的帳號']]:[]).map(([k,v])=>`<a href="${k==='cal'?'calendar.html':'#'+k}" ${pg===k?'aria-current="page"':''}>${v}</a>`).join('')
 +'<span class="sep"></span><a class="ext" href="./">🗓️ 刀房調度板</a><a class="ext" href="cancer.html">🎗️ 癌症討論會</a><a class="ext" href="handoff.html">📝 交班</a><a class="ext" href="meeting.html">🕣 晨會</a><a class="ext" href="'+NOTION_URL+'" target="_blank" rel="noopener">📒 Notion ↗</a>'}
function render(){const pg=page();if(pg==='ho'){location.replace('handoff.html');return}if(pg==='cc'){location.replace('cancer.html');return}if(pg==='cal'){location.replace('calendar.html');return}
 $('#sub').textContent=`總醫師工具箱・${md(today)}`;
 $('#sync').textContent=S.stale?'更新中…':S.loading?'讀取中…':S.err==='conn'?'無法連上同步，顯示可能不是最新':S.err==='nosync'?'未設定同步':'已同步';
 $('#tabs').innerHTML=hubTabs(pg);
 $('#inst').innerHTML=(window.AUTH?AUTH.badge('#me')+' ':'')+'<a href="#" class="hbtn" data-share title="分享或複製這一頁的連結">🔗 分享</a> '+(isStand()?'':'<a href="#" class="hbtn" data-inst>📲 加到主畫面</a>');
 if(S.loading&&!S.people&&S.err!=='nosync'){$('#app').innerHTML='<p class="note">讀取中…</p>';return}
 $('#app').innerHTML=pg==='people'?people():pg==='links'?links():pg==='fb'?fbPage():pg==='me'?mePage():home()}

async function savePeople(mut){saving++;render();try{const fresh=(await get('common/people'))||S.people||{people:[]};fresh.people=fresh.people||[];
  if(S.people&&S.people.seeded&&!fresh.ts)fresh.people=S.people.people;delete fresh.seeded;mut(fresh);fresh.ts=Date.now();await set('common/people',fresh);S.people=fresh}catch(e){alert('儲存失敗，請稍後再試')}saving--;render()}
async function saveLinks(){try{await set('common/links',S.links);const m=$('#lmsg');if(m)m.textContent='已儲存'}catch(e){const m=$('#lmsg');if(m)m.textContent='儲存失敗'}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const k=b.dataset.act;
 if(k==='filt'){filt=b.dataset.v;render()}
 if(k==='fbshow'){fbShow=b.dataset.v;render()}
 if(k==='fbdel'){if(!confirm('刪除這則回饋？'))return;const id=b.dataset.id;fbSave(L=>{const i=L.findIndex(x=>x.id===id);if(i>=0)L.splice(i,1)})}
 if(k==='fbadd'){const t=$('#fbText').value.trim();if(!t){fbMsg='請先寫下內容';render();return}const name=$('#fbName').value.trim(),cat=$('#fbCat').value;LS.set('fbname',name);const n=new Date(),pad=x=>String(x).padStart(2,'0');
  const f={id:'f'+Date.now().toString(36),name,cat,text:t,at:`${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}T${pad(n.getHours())}:${pad(n.getMinutes())}`,st:'new'};fbShow='open';fbDraft=t;fbSave(L=>L.push(f)).then(()=>{if(fbMsg==='已儲存'){fbDraft='';fbMsg='已送出，謝謝！';render()}})}
 if(k==='add'){const r=b.dataset.r;const p={id:'p'+Date.now().toString(36),n:'新成員',full:'',role:r,lv:r==='R'?'R1':r==='F'?'Fellow':'主治醫師',on:true,ts:Date.now()};savePeople(f=>f.people.push(p))}
 if(k==='ladd'){S.links=S.links||{items:[]};S.links.items.push({n:'新連結',u:'',d:''});render();saveLinks()}
 if(k==='ldel'){S.links.items.splice(+b.dataset.i,1);render();saveLinks()}
 if(k==='conn'){const u=$('#u').value.trim();if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)){alert('網址應以 https://script.google.com/ 開頭');return}gs={url:u,token:$('#tk').value.trim(),on:true};LS.set('gsync',gs);load()}});
document.addEventListener('change',e=>{const el=e.target;const v=el.type==='checkbox'?el.checked:el.value.trim();
 if(el.dataset.ch==='pf'){const id=el.dataset.id,f=el.dataset.f;savePeople(R=>{const p=R.people.find(x=>x.id===id);if(!p)return;p[f]=v;if(f==='role')p.lv=v==='R'?'R1':v==='F'?'Fellow':'主治醫師';p.ts=Date.now()})}
 if(el.dataset.ch==='fbDone'||el.dataset.ch==='fbRe'){const id=el.dataset.id,f=el.dataset.ch==='fbDone';fbSave(L=>{const x=L.find(y=>y.id===id);if(x){if(f)x.st=v?'done':'new';else x.re=v}})}
 if(el.dataset.ch==='lf'){S.links.items[+el.dataset.i][el.dataset.f]=v;saveLinks()}});
addEventListener('hashchange',render);
if(window.AUTH){AUTH.init(gs.url,gs.token);addEventListener('auth:change',()=>{if(!saving)load()})}
load();setInterval(()=>{if(!document.hidden&&!saving&&page()==='home')load()},120000);
/* ===== 加到主畫面 ===== */
let bip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();bip=e});
try{if('serviceWorker' in navigator&&/^https:/.test(location.protocol)&&!/claude|googleusercontent/.test(location.host))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
const instLink=()=>location.origin+location.pathname.replace(/[^/]*$/,'')+'hub.html?openExternalBrowser=1';
function showInstall(){const ua=navigator.userAgent,inApp=/Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(ua),ios=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1),and=/Android/i.test(ua);
 const steps=inApp?`<p><b>你現在是在 LINE 裡面開啟的</b>，要先換到手機瀏覽器才能加到主畫面。</p><button class="ibtn p" data-iext>用 ${ios?'Safari':'Chrome'} 開啟</button><p class="inote">開啟後再按一次「📲 加到主畫面」。</p>`
  :ios?`<ol><li>點 Safari 下方（或上方）的<b>分享</b>按鈕 <span class="ik">⬆︎</span></li><li>往下滑，點<b>「加入主畫面」</b> <span class="ik">＋</span></li><li>右上角按<b>「新增」</b></li></ol><p class="inote">要用 Safari 開才有這個選項；Chrome 也可以從「分享」裡找到。</p>`
  :and?`<ol><li>點 Chrome 右上角 <span class="ik">⋮</span></li><li>點<b>「新增至主畫面」</b>或<b>「安裝應用程式」</b></li><li>按<b>「安裝」</b></li></ol>`
  :`<ol><li>Chrome／Edge：網址列右邊的 <span class="ik">⊕</span> 安裝圖示，或選單 →「安裝」</li><li>手機上用 Safari／Chrome 開這個網址，再按「📲 加到主畫面」</li></ol>`;
 const m=document.createElement('div');m.className='imodal';m.innerHTML=`<div class="ibox"><div class="ihead"><img src="hub-apple-touch-icon.png?v=2" alt="" width="48" height="48"><div><b>加到主畫面</b><div class="inote">之後點圖示就能直接打開，像 App 一樣</div></div></div>${steps}
 <div class="ishare"><b>分享給大家</b><p class="inote">把這個連結貼到 LINE 群組，大家點開會自動用手機瀏覽器開啟，再按「📲 加到主畫面」即可。</p><input readonly value="${instLink()}"><button class="ibtn" data-icopy>複製安裝連結</button></div><button class="ibtn" data-iclose>關閉</button></div>`;
 document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-iclose]'))m.remove();if(e.target.closest('[data-iext]'))location.href=instLink();if(e.target.closest('[data-icopy]')){const t='泌尿科 科務入口（點開後按「📲 加到主畫面」）\n'+instLink();const ip=m.querySelector('.ishare input');try{navigator.clipboard.writeText(t).then(()=>{e.target.textContent='已複製 ✓'},()=>{ip.select();document.execCommand('copy');e.target.textContent='已複製 ✓'})}catch(x){ip.select();document.execCommand('copy')}}})}
document.addEventListener('click',async e=>{const a=e.target.closest&&e.target.closest('[data-inst]');if(!a)return;e.preventDefault();e.stopPropagation();if(bip){bip.prompt();try{await bip.userChoice}catch(x){}bip=null;return}showInstall()},true);
/* ===== 一鍵分享／複製連結（[data-share]）=====
   手機：叫出系統分享選單（LINE、訊息、複製…）；電腦或不支援時：直接複製連結並顯示提示。
   連結＝目前這一頁（含分頁 #），加 openExternalBrowser=1 讓 LINE 用手機瀏覽器開啟。 */
const SHARE_T='泌尿科 科務入口';
function shareLink(){const h=location.hash&&!/^#(home)?$/.test(location.hash)?location.hash:'';const base=location.origin+location.pathname.replace(/[^/]*$/,'')+'hub.html';return base+'?openExternalBrowser=1'+h}
function toast(t){const d=document.createElement('div');d.textContent=t;d.setAttribute('role','status');d.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f262b;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:10000;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:90vw;text-align:center';document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}a.remove();return ok}}
document.addEventListener('click',async e=>{const a=e.target.closest&&e.target.closest('[data-share]');if(!a)return;e.preventDefault();e.stopPropagation();
 const url=shareLink(),text=SHARE_T+'（點開後可按「📲 加到主畫面」）';
 if(navigator.share&&/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){try{await navigator.share({title:SHARE_T,text,url});return}catch(x){if(x&&x.name==='AbortError')return}}
 if(await copyText(text+'\n'+url))toast('✓ 已複製連結，貼到 LINE 或訊息就能分享');else prompt('複製這個連結分享給大家：',url)},true);
}
