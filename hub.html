<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="泌尿科入口"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="hub.webmanifest"><link rel="apple-touch-icon" href="hub-apple-touch-icon.png"><link rel="icon" type="image/png" href="hub-favicon.png"><meta name="theme-color" content="#2e346e"><meta property="og:title" content="泌尿科 科務入口"><meta property="og:description" content="人員名冊・常用連結・今日總覽"><meta property="og:image" content="og-hub.png"><meta property="og:type" content="website">
<title>泌尿科 科務入口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f7f7,#0b1315);--card:light-dark(#fff,#121e21);--ink:light-dark(#0f262b,#e2edee);--mut:light-dark(#587076,#8ea6aa);--line:light-dark(#d8e2e3,#24363a);--scrub:light-dark(#0b5563,#0e6474);--soft:light-dark(#e4f0f1,#15313a);--red:#e5484d;--redbg:light-dark(#fdecec,#3a1a1c);--amb:#c77d00;--ambbg:light-dark(#fff4dc,#3a2c10);--ok:#1f8a5b}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans TC",system-ui,sans-serif}
.t{font-family:Figtree,"Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
header{background:var(--scrub);color:#fff;padding:18px max(4vw,14px) 0}
.hrow{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between;max-width:1100px;margin:auto}
h1{font:800 clamp(24px,3.4vw,34px)/1.1 Figtree,"Noto Sans TC",sans-serif;margin:0}
.sub{opacity:.85;font-size:14px}
.tabs{display:flex;gap:4px;max-width:1100px;margin:14px auto 0;overflow-x:auto}
.tabs a{color:#fff;text-decoration:none;border-radius:10px 10px 0 0;padding:11px 18px;opacity:.8;flex:none;min-height:44px}
.tabs a[aria-current=page]{background:var(--bg);color:var(--ink);opacity:1;font-weight:700}
.tabs .sep{flex:none;width:1px;background:rgba(255,255,255,.3);margin:10px 6px}
.tabs a.ext{font-size:14px}
.hbtn{color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:3px 12px;font-size:13px;text-decoration:none;white-space:nowrap}
.hside{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a.kpi{color:inherit;text-decoration:none}a.kpi:hover{border-color:var(--scrub)}
.tool .go{color:inherit;text-decoration:none;display:block}
.tool .ic{font-size:20px;margin-right:6px}
main{max-width:1100px;margin:auto;padding:18px max(4vw,14px) 60px}
section{margin-bottom:22px}
h2{font:700 19px/1.3 "Noto Sans TC",sans-serif;margin:0 0 10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h2 small{font-weight:400;color:var(--mut);font-size:13px}h2 small a{color:var(--scrub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.tool{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--scrub);border-radius:14px;padding:14px 16px;min-height:96px}
.tool:hover{border-color:var(--scrub)}
.tool b{font-size:17px}.tool p{margin:4px 0 0;color:var(--mut);font-size:13.5px}
.tool.soon{border-left-color:var(--line);opacity:.75;cursor:default}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12.5px;background:var(--soft);white-space:nowrap}
.chip.r{background:var(--redbg);color:var(--red)}.chip.a{background:var(--ambbg);color:var(--amb)}.chip.g{color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font:800 26px/1.1 Figtree,sans-serif}.kpi span{color:var(--mut);font-size:13px}
.note{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;min-height:40px;cursor:pointer}
.btn.p{background:var(--scrub);color:#fff;border-color:var(--scrub)}.btn.s{min-height:32px;padding:4px 10px;font-size:13.5px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:38px}
table{width:100%;border-collapse:collapse}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:13px;color:var(--mut);font-weight:500}
tr.off td{opacity:.5}
.dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}.dl dt{color:var(--mut)}.dl dd{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;background:var(--card);color:var(--ink);padding:6px 12px;font:inherit;cursor:pointer;min-height:36px}.seg button.on{background:var(--scrub);color:#fff}
@media (max-width:700px){
 .kpis{grid-template-columns:repeat(2,1fr);gap:8px}.kpi{padding:10px}.kpi b{font-size:22px}.kpi span{font-size:12px}.tool{min-height:0}
 table.stack thead{display:none}table.stack tr{display:grid;grid-template-columns:1fr 1fr;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}table.stack td{border:0;padding:0}table.stack td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:var(--mut)}table.stack input,table.stack select{width:100%}
}
.imodal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9999;padding:12px}.ibox{background:var(--card,#fff);color:var(--ink,#0f262b);border-radius:16px;max-width:420px;width:100%;padding:16px 18px;font-size:15px;line-height:1.6;box-shadow:0 10px 40px rgba(0,0,0,.3)}.ihead{display:flex;gap:12px;align-items:center;margin-bottom:8px}.ihead img{border-radius:11px}.ibox ol{padding-left:22px;margin:8px 0}.ibox li{margin:4px 0}.ik{display:inline-block;border:1px solid var(--line,#ccc);border-radius:6px;padding:0 6px;font-weight:700}.inote{color:var(--mut,#587076);font-size:13px;margin:4px 0}.ishare{border-top:1px solid var(--line,#ddd);margin-top:10px;padding-top:10px}.ishare input{width:100%;font-size:13px;margin:4px 0}.ibtn{border:1px solid var(--line,#ccc);background:var(--card,#fff);color:inherit;border-radius:10px;padding:8px 14px;font:inherit;min-height:40px;margin:4px 6px 0 0;cursor:pointer}.ibtn.p{background:#0b5563;color:#fff;border-color:#0b5563}@media(min-width:700px){.imodal{align-items:center}}
</style>
</head>
<body>
<header><div class="hrow"><div><h1>泌尿科 科務入口</h1><div class="sub" id="sub"></div></div><div class="hside"><span class="sub" id="sync"></span><span id="inst"></span></div></div>
<nav class="tabs" id="tabs"></nav></header>
<main id="app"><p class="note">載入中…</p></main>
<script>
{
/* 同步：與刀房調度板共用同一個 Google Apps Script 儲存區
   共用資料鍵（給之後的小工具用）：
   common/people  人員名冊 {ts, people:[{id,n,full,role:'VS'|'R'|'F',lv,on,ts}]}
   common/links   常用連結 {items:[{n,u,d}]}
   common/handoff 黃部長交班單 {u:Google 文件網址, ts}（沒設定時用 HO_URL）
   ?action=cancerStatus 癌症討論會人數（Code.gs cancerStatus，不含病人資料）
   config/main    調度板設定（含 duty 值班、leaves 休假、vsLeaves 主治休假）
   days/YYYY-MM-DD 當日刀表與人力；er/list 急診刀清單 */
const SYNC_URL='https://script.google.com/macros/s/AKfycbyW-2Q_et8fXF4M45GVlxj8fJuCbRhTixBEg7UWA-xCku2AVWGCuvFE9M_W0WJoKayvAg/exec';
const LS={get(k){try{return JSON.parse(localStorage.getItem('or:'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('or:'+k,JSON.stringify(v))}catch(e){}}};
let gs=LS.get('gsync');if(!gs||!gs.url)gs=SYNC_URL?{url:SYNC_URL,token:'',on:true}:{url:'',token:'',on:false};
const on=()=>gs.on&&gs.url;
async function get(key){const r=await fetch(gs.url+(gs.url.includes('?')?'&':'?')+'key='+encodeURIComponent(key)+'&token='+encodeURIComponent(gs.token||''));const j=await r.json();if(!j.ok)throw new Error(j.err||'fail');return j.value}
async function set(key,value){const r=await fetch(gs.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:gs.token||'',key,value})});const j=await r.json();if(!j.ok)throw new Error(j.err||'fail')}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const DOW='日一二三四五六';const md=s=>`${+s.slice(5,7)}/${+s.slice(8)}（${DOW[new Date(s+'T00:00:00').getDay()]}）`;
const today=iso(new Date()),tmr=addD(today,1);
const ROLE={VS:'主治醫師',R:'住院醫師',F:'Fellow'};
const NOTION_URL='https://shengmin.notion.site/a40ece61b33441b8950284c54ab01f55';
const CANCER_URL='https://docs.google.com/spreadsheets/d/1OaCFv8mcIf8lKyyX__Tj_at4Y8KsX5q50r7F2F6riiI/edit';
/* 首頁「工具」：ext＝開新分頁；sub＝調度板分頁捷徑 */
const TOOLS=[
 {i:'🗓️',n:'刀房調度板',u:'./',d:'每日刀序、住院醫師人力、急診刀、術前準備、值班表',sub:[['import','📥 匯入刀表'],['plan','今日排程'],['er','急診刀'],['prep','術前準備'],['res','人力與能力']]},
 {i:'🕣',n:'晨會',u:'#mtg',d:'週二科部晨會：未來規劃、歷次議程、科內公告與報告統計（讀 Drive「W2 科部晨會」）'},
 {i:'📝',n:'黃部長交班',u:'#ho',d:'交班單（Google 文件），可直接在入口內檢視'},
 {i:'🎗️',n:'癌症討論會',u:'#cc',d:'下次討論會要挑的個案、討論後注意事項、統計（資料在 Google 試算表）'},
 {i:'📒',n:'Notion 科內筆記',u:NOTION_URL,d:'科內共筆、規範與教學資料',ext:1}];
const SOON=['科會事項追蹤','住院醫師排班'];
let S={people:null,links:null,cfg:null,dT:null,dM:null,er:null,err:'',loading:true},filt='cur',saving=0;
const isStand=()=>{try{return matchMedia('(display-mode: standalone)').matches||!!navigator.standalone}catch(e){return false}};
const page=()=>(location.hash||'#home').slice(1);

async function load(){S.loading=true;render();if(!on()){S.loading=false;S.err='nosync';render();return}ccLoad();
 const k=['common/people','common/links','config/main','days/'+today,'days/'+tmr,'er/list','common/handoff','meeting/drive','meeting/plan'];
 const r=await Promise.allSettled(k.map(get));const v=i=>r[i].status==='fulfilled'?r[i].value:null;
 if(r.every(x=>x.status==='rejected'))S.err='conn';else S.err='';
 S.people=v(0);S.links=v(1);{const DEF=[{n:'泌尿科指引更新',u:'https://urotrial-weekly-tw.shady-knoll-9572.chatgpt.site',d:'每週泌尿科指引與試驗更新'},{n:'癌症討論會試算表',u:CANCER_URL,d:'每週名單整理與統計'}];const L0=S.links||{items:[]};L0.items=L0.items||[];const seen=new Set(L0.done||[]);let add=0;for(const x of DEF)if(!seen.has(x.u)){if(!L0.items.some(y=>y.u===x.u)){L0.items.push(x);add++}seen.add(x.u)}L0.done=[...seen];S.links=L0;if(add||!(v(1)||{}).done){set('common/links',L0).catch(()=>{})}}S.cfg=v(2)&&v(2).cfg;S.dT=v(3);S.dM=v(4);S.er=v(5);S.ho=v(6);S.md=v(7);S.mp=v(8);
 if(!S.people&&S.cfg)S.people=seed(S.cfg);S.loading=false;render()}
function seed(c){const now=Date.now();return{ts:now,seeded:true,people:[...(c.res||[]).map(r=>({id:r.id,n:r.n,full:(String(r.alias||'').split(/[,，]/)[0]||'').trim(),role:r.lv==='Fellow'?'F':'R',lv:r.lv,on:!!r.on,ts:now})),...(c.sur||[]).map(x=>({id:'vs_'+x.n,n:x.n,full:x.n,role:'VS',lv:x.t||'主治醫師',on:true,ts:now}))]}}
const P=()=>(S.people&&S.people.people)||[];
const nm=id=>{const p=P().find(x=>x.id===id);if(p)return p.n;const r=((S.cfg||{}).res||[]).find(x=>x.id===id);return r?r.n:id};

function home(){if(S.err==='nosync')return setupCard();
 const c=S.cfg||{},L=(c.duty||{})[today]||[],g=r=>L.filter(x=>(String(x).split(':')[1]||'')===r).map(x=>nm(String(x).split(':')[0]));
 const lv=(c.leaves||[]).filter(l=>l.from<=today&&(l.to||l.from)>=today).map(l=>`${nm(l.r)}${l.type?'（'+l.type+(l.half&&l.half!=='all'?(l.half==='am'?'・上午':'・下午'):'')+'）':''}`);
 const vl=(c.vsLeaves||[]).filter(l=>l.from<=today&&(l.to||l.from)>=today).map(l=>esc(l.s));
 const day=(d,lab,ds)=>{const cs=(d&&d.cases||[]).filter(x=>!x.eve);const rooms=new Set(cs.map(x=>x.room).filter(r=>r!=='ESWL'));return `<a class="kpi" href="./#plan"><span>${lab} ${md(ds)}刀房</span><b>${cs.length?cs.length+' 台':'—'}</b><span>${cs.length?rooms.size+' 間房':'刀表未匯入'}</span></a>`};
 const er=((S.er&&S.er.items)||[]).filter(e=>!e.del&&(e.st||'wait')!=='done');const ct=t=>er.filter(e=>e.t===t).length;
 const duty=[['sec','二線'],['icu','ICU'],['w1','一線'],['tot','總值'],['','']].map(([k,v])=>g(k).length?(v?v+' ':'')+g(k).join('、'):'').filter(Boolean).map(esc).join('　');
 const tu=new Set(TOOLS.map(t=>t.u)),lk=((S.links&&S.links.items)||[]).filter(l=>l.u&&!tu.has(l.u));
 const tool=t=>{const tg=t.ext?'target="_blank" rel="noopener"':'';return `<div class="tool"><a class="go" href="${t.u}" ${tg}><b><span class="ic">${t.i}</span>${t.n}${t.ext?' <small class="note">↗</small>':''}</b><p>${t.d}</p></a>${t.sub?`<div class="row" style="gap:6px;margin-top:8px">${t.sub.map(([k,v])=>`<a class="btn s" style="text-decoration:none" href="${t.u}#${k}">${v}</a>`).join('')}</div>`:''}</div>`};
 return `<section><h2>① 今日總覽 <small>${md(today)}</small></h2><div class="kpis">${day(S.dT,'今天',today)}${day(S.dM,'明天',tmr)}
  ${(()=>{if(typeof mtgDates!=='function')return'';const d=mtgDates(1)[0],w=((S.md&&S.md.weeks)||[]).find(x=>x.d===d),n=mItems().filter(x=>x.d===d&&!x.dup&&!x.hide).length;return `<a class="kpi" href="#mtg"><span>下次晨會 ${md(d)}</span><b>${n?n+' 項':'—'}</b><span>${w?'簡報已上傳':'還沒有簡報'}</span></a>`})()}${ccKpi()}<a class="kpi" href="./#er"><span>急診刀待處理</span><b>${er.length} 台</b><span>${er.length?`插刀 ${ct('insert')}・緊急 ${ct('urgent')}・一般急 ${ct('general')}`:'目前沒有'}</span></a></div>
  <div class="card" style="margin-top:10px"><dl class="dl">
   <dt>今晚值班</dt><dd>${duty||'<span class="note">值班表未匯入（在調度板「人力與能力」匯入）</span>'}</dd>
   <dt>住院醫師休假</dt><dd>${lv.length?esc(lv.join('、')):'<span class="note">無</span>'}</dd>
   <dt>主治休假</dt><dd>${vl.length?vl.join('、'):'<span class="note">無</span>'}</dd></dl></div></section>
 <section><h2>② 工具</h2><div class="grid">${TOOLS.map(tool).join('')}</div><p class="note" style="margin:8px 2px 0">規劃中：${SOON.join('・')}</p></section>
 <section><h2>③ 常用連結 <small><a href="#links">編輯</a></small></h2>${lk.length?`<div class="grid">${lk.map(l=>`<a class="tool" href="${esc(l.u)}" target="_blank" rel="noopener"><b>${esc(l.n)}</b><p>${esc(l.d||l.u)}</p></a>`).join('')}</div>`:'<p class="note">還沒有其他連結。可以在「常用連結」分頁加入醫院系統入口等。</p>'}</section>`}

function people(){if(S.err==='nosync')return setupCard();const all=P();
 const L=all.filter(p=>filt==='cur'?p.on!==false:filt==='off'?p.on===false:true).sort((a,b)=>(a.on===false)-(b.on===false)||'VSFR'.indexOf(a.role)-'VSFR'.indexOf(b.role)||String(b.lv).localeCompare(String(a.lv))||String(a.n).localeCompare(String(b.n)));
 const cnt=r=>all.filter(p=>p.on!==false&&p.role===r).length;
 return `<section class="card"><h2>人員名冊 <small>主治 ${cnt('VS')}・Fellow ${cnt('F')}・住院醫師 ${cnt('R')}；所有工具共用這份名單。改姓名、級別、在職會同步到刀房調度板；手術能力在調度板設定。${S.people&&S.people.seeded?'<b>目前顯示的是從調度板帶入的名單，第一次修改後就會存成正式名冊。</b>':''}</small></h2>
 <div class="row" style="margin-bottom:10px"><div class="seg">${[['cur','在職'],['off','已離開'],['all','全部']].map(([k,v])=>`<button class="${filt===k?'on':''}" data-act="filt" data-v="${k}">${v}</button>`).join('')}</div>
  <button class="btn p" data-act="add" data-r="R">＋住院醫師</button><button class="btn" data-act="add" data-r="VS">＋主治醫師</button><button class="btn" data-act="add" data-r="F">＋Fellow</button><span class="note" id="pmsg">${saving?'儲存中…':''}</span></div>
 <table class="stack"><thead><tr><th>簡稱（排班顯示）</th><th>全名</th><th>身分</th><th>級別／職稱</th><th>在職</th></tr></thead><tbody>
 ${L.map(p=>`<tr class="${p.on===false?'off':''}"><td data-l="簡稱"><input data-ch="pf" data-id="${esc(p.id)}" data-f="n" value="${esc(p.n)}" style="width:100px"></td><td data-l="全名"><input data-ch="pf" data-id="${esc(p.id)}" data-f="full" value="${esc(p.full||'')}" style="width:110px"></td>
  <td data-l="身分"><select data-ch="pf" data-id="${esc(p.id)}" data-f="role">${Object.entries(ROLE).map(([k,v])=>`<option value="${k}" ${p.role===k?'selected':''}>${v}</option>`).join('')}</select></td>
  <td data-l="級別／職稱">${p.role==='R'?`<select data-ch="pf" data-id="${esc(p.id)}" data-f="lv">${['R1','R2','R3','R4','R5','CR'].map(l=>`<option ${p.lv===l?'selected':''}>${l}</option>`).join('')}</select>`:p.role==='F'?'Fellow':`<input data-ch="pf" data-id="${esc(p.id)}" data-f="lv" value="${esc(p.lv||'')}" placeholder="部長、主任…" style="width:110px">`}</td>
  <td data-l="在職"><label class="row" style="gap:4px"><input type="checkbox" data-ch="pf" data-id="${esc(p.id)}" data-f="on" ${p.on!==false?'checked':''} style="min-height:0">${p.on!==false?'在職':'已離開'}</label></td></tr>`).join('')}</tbody></table>
 <p class="note">離開的人請取消「在職」而不要刪除，舊的排班紀錄才對得起來。名冊只放姓名與職級，請勿填病人資料。</p></section>`}

  ${w&&w.files.length?`<details style="margin-top:6px"><summary class="note">檔案 ${w.files.length} 個</summary><ul style="margin:4px 0;padding-left:20px">${w.files.map(f=>`<li>${esc(f.n)}</li>`).join('')}</ul></details>`:''}</div>`}).join('');
 return `<section class="card" style="margin-bottom:12px"><div class="row"><input id="mq" data-ch="mq" value="${esc(mq)}" placeholder="搜尋題目或報告人" style="flex:1;min-width:200px">
  <select data-ch="mtf"><option value="">全部類型</option>${MT.map(([k,n])=>`<option value="${k}" ${mtf===k?'selected':''}>${n}</option>`).join('')}</select>
  <button class="btn s ${mfix?'p':''}" data-act="mfix">${mfix?'✓ 完成修正':'✏️ 修正分類／報告人'}</button></div>
  ${mfix?'<p class="note" style="margin:6px 0 0">分類與報告人是依題目自動判斷的；改了以後統計會跟著變。「不列入」＝不算進統計與公告。</p>':''}</section>
 ${body||'<p class="note">還沒有晨會紀錄。按上方「🔄 從 Drive 更新」讀取 Drive 資料夾。</p>'}`}

function mNotice(){const M=MP(),all=mItems().filter(x=>NOTICE.includes(x.t)&&!x.hide&&!x.dup&&x.d);
 const pin=x=>{const p=M.pins[x.k];return p&&p.on&&(!p.until||p.until>=today)};
 const act=all.filter(x=>pin(x)||(x.src==='plan'&&x.until&&x.until>=today)).sort((a,b)=>a.d<b.d?1:-1);
 const yr=today.slice(0,4),thisY=all.filter(x=>x.d.startsWith(yr));
 const mons=[...new Set(all.map(x=>x.d.slice(0,7)))].sort().reverse();
 const line=x=>{const p=M.pins[x.k]||{};return `<tr><td data-l="日期" class="t">${md(x.d)}</td><td data-l="類別">${mchip(x.t)}</td><td data-l="內容">${esc(x.title)}${x.note?`<br><span class="note">${esc(x.note)}</span>`:''}</td>
  <td data-l="長期有效"><button class="btn s ${pin(x)?'p':''}" data-act="mpin" data-k="${esc(x.k)}" title="釘選成目前有效的規定">${pin(x)?'📌 有效中':'📌 釘選'}</button>${pin(x)||p.until?` <input type="date" data-ch="mpu" data-k="${esc(x.k)}" value="${esc(p.until||'')}" title="有效到（空白＝一直有效）" style="min-height:32px">`:''}</td></tr>`};
 return `<section><div class="kpis">${NOTICE.map(t=>`<div class="kpi"><span>${yr} 年${MTN[t]}</span><b>${thisY.filter(x=>x.t===t).length}</b><span>則</span></div>`).join('')}<div class="kpi"><span>目前有效</span><b>${act.length}</b><span>則規定／提醒</span></div></div></section>
 <section class="card"><h2>📌 目前有效的規定與提醒 <small>從下面的公告按「釘選」加入；可設定有效到哪天</small></h2>
  ${act.length?`<table class="stack"><tbody>${act.map(line).join('')}</tbody></table>`:'<p class="note">還沒有釘選的公告。例如「達文西以一換一房不能超過 18:00」「Lumenis 只能 R6/R16」這類長期規定可以釘選在這裡。</p>'}
  <div class="row" style="margin-top:8px"><button class="btn s p" data-act="mnadd">＋ 新增公告</button><span class="note">不在簡報裡的口頭公告、LINE 群組通知也可以記在這裡（記在今天的晨會）</span></div>
  ${M.items.filter(x=>!x.del&&x.d===today&&NOTICE.includes(x.t)).length?`<table class="stack" style="margin-top:8px"><tbody>${M.items.filter(x=>!x.del&&x.d===today&&NOTICE.includes(x.t)).map(x=>mrow(x)).join('')}</tbody></table>`:''}</section>
 <section class="card" style="margin-top:14px"><h2>每月公告數</h2><div style="overflow-x:auto"><table><thead><tr><th>月份</th>${NOTICE.map(t=>`<th>${MTN[t]}</th>`).join('')}<th>合計</th></tr></thead><tbody>
  ${mons.map(m=>{const L=all.filter(x=>x.d.startsWith(m));return `<tr><td class="t">${m.replace('-','/')}</td>${NOTICE.map(t=>`<td>${L.filter(x=>x.t===t).length||''}</td>`).join('')}<td><b>${L.length}</b></td></tr>`}).join('')||'<tr><td colspan="5" class="note">沒有資料</td></tr>'}</tbody></table></div></section>
 <section style="margin-top:14px"><h2>所有公告 <small>依日期，新的在上面</small></h2>${mons.map(m=>`<div class="card" style="margin-bottom:10px"><h2 style="font-size:16px">${+m.slice(5)} 月 <small>${m.slice(0,4)}</small></h2><table class="stack"><tbody>${all.filter(x=>x.d.startsWith(m)).sort((a,b)=>a.d<b.d?1:-1).map(line).join('')}</tbody></table></div>`).join('')||'<p class="note">沒有資料</p>'}</section>`}

function mStat(){const from=mrange==='6m'?addD(today,-183):mrange==='y'?today.slice(0,4)+'-01-01':'0000';
 const L=mItems().filter(x=>!x.hide&&!x.dup&&x.d&&x.d>=from&&x.d<=today),days=new Set(L.map(x=>x.d));
 const ppl={};L.forEach(x=>x.who.split('、').filter(Boolean).forEach(n=>{const r=ppl[n]=ppl[n]||{n,c:{},tot:0,last:''};r.c[x.t]=(r.c[x.t]||0)+1;r.tot++;if(x.d>r.last)r.last=x.d}));
 const cols=MT.map(x=>x[0]).filter(t=>Object.values(ppl).some(r=>r.c[t]));
 const R=Object.values(ppl).sort((a,b)=>b.tot-a.tot||a.n.localeCompare(b.n));
 const role=n=>{const p=mpers(n);return p?(p.role==='R'?p.lv:p.role==='F'?'Fellow':p.lv||'主治'):''};
 return `<section><div class="row" style="margin-bottom:10px"><div class="seg">${[['6m','近 6 個月'],['y','今年'],['all','全部']].map(([k,v])=>`<button class="${mrange===k?'on':''}" data-act="mrange" data-v="${k}">${v}</button>`).join('')}</div></div>
 <div class="kpis"><div class="kpi"><span>晨會次數</span><b>${days.size}</b><span>次</span></div><div class="kpi"><span>議程項目</span><b>${L.length}</b><span>平均每次 ${days.size?(L.length/days.size).toFixed(1):0} 項</span></div>
 ${MT.filter(x=>L.some(y=>y.t===x[0])).map(([k,n])=>`<div class="kpi"><span>${n}</span><b>${L.filter(x=>x.t===k).length}</b><span>項</span></div>`).join('')}</div></section>
 <section class="card"><h2>個人報告次數 <small>依議程題目後面的「- 某某醫師」判斷，不準的地方到「紀錄」修正</small></h2>
 ${R.length?`<div style="overflow-x:auto"><table><thead><tr><th>報告人</th>${cols.map(t=>`<th>${MTN[t]}</th>`).join('')}<th>合計</th><th>最近一次</th></tr></thead><tbody>${R.map(r=>`<tr><td><b>${esc(r.n)}</b> <span class="note">${esc(role(r.n))}</span></td>${cols.map(t=>`<td>${r.c[t]||''}</td>`).join('')}<td><b>${r.tot}</b></td><td class="t">${md(r.last)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="note">這段期間沒有資料。</p>'}</section>`}

async function savePlan(mut){saving++;try{const fresh=(await get('meeting/plan'))||S.mp||{};S.mp=fresh;const M=MP();mut(M);M.ts=Date.now();await set('meeting/plan',M)}catch(e){alert('儲存失敗，請稍後再試')}saving--;render()}
async function mScan(){const m=$('#mscanmsg');if(m)m.textContent='讀取 Drive 中…（第一次最多要 5 分鐘，請勿關閉）';
 try{const r=await fetch(gs.url+(gs.url.includes('?')?'&':'?')+'action=meetingScan&token='+encodeURIComponent(gs.token||''));const j=await r.json();if(!j.ok)throw new Error(j.err||'fail');S.md=j.value;render()}
 catch(e){const m=$('#mscanmsg');if(m)m.textContent='讀不到 Drive：'+(/drive|DriveApp|權限|permission/i.test(String(e))?'Apps Script 需要重新授權 Drive 權限（見開發說明）':String(e.message||e)).slice(0,80)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||!/^m(v|scan|add|del|pin|nadd|fix|range)$/.test(b.dataset.act))return;e.stopPropagation();const k=b.dataset.act;
 if(k==='mv'){mv=b.dataset.v;LS.set('mtgView',mv);render()}
 if(k==='mrange'){mrange=b.dataset.v;render()}
 if(k==='mfix'){mfix=!mfix;render()}
 if(k==='mscan')mScan();
 if(k==='madd'){const x={id:'m'+Date.now().toString(36),d:b.dataset.d,t:'other',title:'',who:'',note:'',ts:Date.now()};savePlan(M=>M.items.push(x))}
 if(k==='mnadd'){const x={id:'m'+Date.now().toString(36),d:today,t:'notice',title:'',who:'',note:'',ts:Date.now()};savePlan(M=>M.items.push(x))}
 if(k==='mdel'){const id=b.dataset.id;savePlan(M=>{const x=M.items.find(y=>y.id===id);if(x){x.del=true;x.ts=Date.now()}})}
 if(k==='mpin'){const key=b.dataset.k;savePlan(M=>{const p=M.pins[key]||{};const on=!(p.on&&(!p.until||p.until>=today));M.pins[key]={on,until:on?'':p.until||'',ts:Date.now()}})}},true);
document.addEventListener('change',e=>{const el=e.target,c=el.dataset.ch;if(!c||!/^m/.test(c))return;e.stopPropagation();const v=el.type==='checkbox'?el.checked:el.value.trim();
 if(c==='mq'){mq=v;render()}
 if(c==='mtf'){mtf=v;render()}
 if(c==='mi'){const id=el.dataset.id,f=el.dataset.f;savePlan(M=>{const x=M.items.find(y=>y.id===id);if(!x)return;x[f]=v;if(f==='title'&&x.t==='other'&&v)x.t=mcls(v);if(f==='title'&&!x.who)x.who=mwho(v);x.ts=Date.now()})}
 if(c==='mo'){const key=el.dataset.k,f=el.dataset.f;savePlan(M=>{const o=M.ov[key]=M.ov[key]||{};o[f]=v;o.ts=Date.now()})}
 if(c==='mpu'){const key=el.dataset.k;savePlan(M=>{const p=M.pins[key]=M.pins[key]||{on:true};p.until=v;p.ts=Date.now()})}},true);

function setupCard(){return `<section class="card"><h2>尚未連上同步</h2><p>入口網頁和刀房調度板共用同一個 Google 同步網址。若調度板已經設定好，請先在同一支手機／電腦打開一次<a href="./">刀房調度板</a>，再回來重新整理。</p>
 <div class="row"><input id="u" placeholder="https://script.google.com/macros/s/…/exec" style="flex:1;min-width:260px" value="${esc(gs.url)}"><input id="tk" placeholder="密碼（沒有就留空）" value="${esc(gs.token||'')}" style="width:150px"><button class="btn p" data-act="conn">連線</button></div></section>`}

function render(){const pg=page();
 $('#sub').textContent=`總醫師工具箱・${md(today)}`;
 $('#sync').textContent=S.loading?'讀取中…':S.err==='conn'?'無法連上同步，顯示可能不是最新':S.err==='nosync'?'未設定同步':'已同步';
 $('#tabs').innerHTML=[['home','首頁'],['mtg','晨會'],['ho','黃部長交班'],['cc','癌症討論會'],['people','人員名冊'],['links','常用連結']].map(([k,v])=>`<a href="#${k}" ${pg===k?'aria-current="page"':''}>${v}</a>`).join('')+'<span class="sep"></span><a class="ext" href="./">🗓️ 刀房調度板</a><a class="ext" href="'+NOTION_URL+'" target="_blank" rel="noopener">📒 Notion ↗</a>';
 $('#inst').innerHTML=isStand()?'':'<a href="#" class="hbtn" data-inst>📲 加到主畫面</a>';
 if(S.loading&&!S.people&&S.err!=='nosync'){$('#app').innerHTML='<p class="note">讀取中…</p>';return}
 $('#app').innerHTML=pg==='mtg'?meeting():pg==='ho'?handoff():pg==='cc'?cancer():pg==='people'?people():pg==='links'?links():home()}

async function savePeople(mut){saving++;render();try{const fresh=(await get('common/people'))||S.people||{people:[]};fresh.people=fresh.people||[];
  if(S.people&&S.people.seeded&&!fresh.ts)fresh.people=S.people.people;delete fresh.seeded;mut(fresh);fresh.ts=Date.now();await set('common/people',fresh);S.people=fresh}catch(e){alert('儲存失敗，請稍後再試')}saving--;render()}
async function saveLinks(){try{await set('common/links',S.links);const m=$('#lmsg');if(m)m.textContent='已儲存'}catch(e){const m=$('#lmsg');if(m)m.textContent='儲存失敗'}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const k=b.dataset.act;
 if(k==='filt'){filt=b.dataset.v;render()}
 if(k==='add'){const r=b.dataset.r;const p={id:'p'+Date.now().toString(36),n:'新成員',full:'',role:r,lv:r==='R'?'R1':r==='F'?'Fellow':'主治醫師',on:true,ts:Date.now()};savePeople(f=>f.people.push(p))}
 if(k==='ccv'){e.preventDefault();ccView=b.dataset.v;render();return}
 if(k==='ccre'){S.cc=null;render();ccLoad();return}
 if(k==='hoedit'){const f=$('#hoform');if(f)f.hidden=!f.hidden}
 if(k==='hosave'){const u=$('#hou').value.trim();if(!docId(u)){alert('請貼上 Google 文件網址（docs.google.com/document/d/…）');return}const v={u,ts:Date.now()};set('common/handoff',v).then(()=>{S.ho=v;render()},()=>{const m=$('#homsg');if(m)m.textContent='儲存失敗'})}
 if(k==='ladd'){S.links=S.links||{items:[]};S.links.items.push({n:'新連結',u:'',d:''});render();saveLinks()}
 if(k==='ldel'){S.links.items.splice(+b.dataset.i,1);render();saveLinks()}
 if(k==='conn'){const u=$('#u').value.trim();if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)){alert('網址應以 https://script.google.com/ 開頭');return}gs={url:u,token:$('#tk').value.trim(),on:true};LS.set('gsync',gs);load()}});
document.addEventListener('change',e=>{const el=e.target;const v=el.type==='checkbox'?el.checked:el.value.trim();
 if(el.dataset.ch==='pf'){const id=el.dataset.id,f=el.dataset.f;savePeople(R=>{const p=R.people.find(x=>x.id===id);if(!p)return;p[f]=v;if(f==='role')p.lv=v==='R'?'R1':v==='F'?'Fellow':'主治醫師';p.ts=Date.now()})}
 if(el.dataset.ch==='lf'){S.links.items[+el.dataset.i][el.dataset.f]=v;saveLinks()}});
addEventListener('hashchange',render);
load();setInterval(()=>{if(!document.hidden&&!saving&&page()==='home')load()},120000);
/* ===== 加到主畫面 ===== */
let bip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();bip=e});
try{if('serviceWorker' in navigator&&/^https:/.test(location.protocol)&&!/claude|googleusercontent/.test(location.host))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
const instLink=()=>location.origin+location.pathname.replace(/[^/]*$/,'')+'hub.html?openExternalBrowser=1';
function showInstall(){const ua=navigator.userAgent,inApp=/Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(ua),ios=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1),and=/Android/i.test(ua);
 const steps=inApp?`<p><b>你現在是在 LINE 裡面開啟的</b>，要先換到手機瀏覽器才能加到主畫面。</p><button class="ibtn p" data-iext>用 ${ios?'Safari':'Chrome'} 開啟</button><p class="inote">開啟後再按一次「📲 加到主畫面」。</p>`
  :ios?`<ol><li>點 Safari 下方（或上方）的<b>分享</b>按鈕 <span class="ik">⬆︎</span></li><li>往下滑，點<b>「加入主畫面」</b> <span class="ik">＋</span></li><li>右上角按<b>「新增」</b></li></ol><p class="inote">要用 Safari 開才有這個選項；Chrome 也可以從「分享」裡找到。</p>`
  :and?`<ol><li>點 Chrome 右上角 <span class="ik">⋮</span></li><li>點<b>「新增至主畫面」</b>或<b>「安裝應用程式」</b></li><li>按<b>「安裝」</b></li></ol>`
  :`<ol><li>Chrome／Edge：網址列右邊的 <span class="ik">⊕</span> 安裝圖示，或選單 →「安裝」</li><li>手機上用 Safari／Chrome 開這個網址，再按「📲 加到主畫面」</li></ol>`;
 const m=document.createElement('div');m.className='imodal';m.innerHTML=`<div class="ibox"><div class="ihead"><img src="hub-apple-touch-icon.png" alt="" width="48" height="48"><div><b>加到主畫面</b><div class="inote">之後點圖示就能直接打開，像 App 一樣</div></div></div>${steps}
 <div class="ishare"><b>分享給大家</b><p class="inote">把這個連結貼到 LINE 群組，大家點開會自動用手機瀏覽器開啟，再按「📲 加到主畫面」即可。</p><input readonly value="${instLink()}"><button class="ibtn" data-icopy>複製安裝連結</button></div><button class="ibtn" data-iclose>關閉</button></div>`;
 document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-iclose]'))m.remove();if(e.target.closest('[data-iext]'))location.href=instLink();if(e.target.closest('[data-icopy]')){const t='泌尿科 科務入口（點開後按「📲 加到主畫面」）\n'+instLink();const ip=m.querySelector('.ishare input');try{navigator.clipboard.writeText(t).then(()=>{e.target.textContent='已複製 ✓'},()=>{ip.select();document.execCommand('copy');e.target.textContent='已複製 ✓'})}catch(x){ip.select();document.execCommand('copy')}}})}
document.addEventListener('click',async e=>{const a=e.target.closest&&e.target.closest('[data-inst]');if(!a)return;e.preventDefault();e.stopPropagation();if(bip){bip.prompt();try{await bip.userChoice}catch(x){}bip=null;return}showInstall()},true);
}
</script>
