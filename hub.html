<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f7f7,#0b1315);--card:light-dark(#fff,#121e21);--ink:light-dark(#0f262b,#e2edee);--mut:light-dark(#587076,#8ea6aa);--line:light-dark(#d8e2e3,#24363a);--scrub:light-dark(#0b5563,#0e6474);--soft:light-dark(#e4f0f1,#15313a);--red:#e5484d;--redbg:light-dark(#fdecec,#3a1a1c);--amb:#c77d00;--ambbg:light-dark(#fff4dc,#3a2c10);--ok:#1f8a5b}

a.kpi{color:inherit;text-decoration:none}a.kpi:hover{border-color:var(--scrub)}

h2{font:700 19px/1.3 "Noto Sans TC",sans-serif;margin:0 0 10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h2 small{font-weight:400;color:var(--mut);font-size:13px}h2 small a{color:var(--scrub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}

.tool:hover{border-color:var(--scrub)}

input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:38px}
table{width:100%;border-collapse:collapse}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:13px;color:var(--mut);font-weight:500}
tr.off td{opacity:.5}
.dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}.dl dt{color:var(--mut)}.dl dd{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;background:var(--card);color:var(--ink);padding:6px 12px;font:inherit;cursor:pointer;min-height:36px}.seg button.on{background:var(--scrub);color:#fff}
@media (max-width:700px){
 .kpis{grid-template-columns:repeat(2,1fr);gap:8px}.kpi{padding:10px}.kpi b{font-size:22px}.kpi span{font-size:12px}.tool{min-height:0}
 table.stack thead{display:none}table.stack tr{display:grid;grid-template-columns:1fr 1fr;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}table.stack td{border:0;padding:0}table.stack td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:var(--mut)}table.stack input,table.stack select{width:100%}
}
.fbl{list-style:none;padding:0;margin:0}.fbl li{border-top:1px solid var(--line);padding:10px 0}.fbl li:first-child{border-top:0}.fbl li.dn .fbt{opacity:.6}
textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
.ver{border-left:3px solid var(--line);padding:2px 0 2px 14px;margin:0 0 14px}.ver.cur{border-left-color:var(--scrub)}.ver h3{margin:0;font-size:16px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.ver ul{margin:4px 0 0;padding-left:20px}.ver li{margin:2px 0}
.imodal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9999;padding:12px}.ibox{background:var(--card,#fff);color:var(--ink,#0f262b);border-radius:16px;max-width:420px;width:100%;padding:16px 18px;font-size:15px;line-height:1.6;box-shadow:0 10px 40px rgba(0,0,0,.3)}.ihead{display:flex;gap:12px;align-items:center;margin-bottom:8px}.ihead img{border-radius:11px}.ibox ol{padding-left:22px;margin:8px 0}.ibox li{margin:4px 0}.ik{display:inline-block;border:1px solid var(--line,#ccc);border-radius:6px;padding:0 6px;font-weight:700}.inote{color:var(--mut,#587076);font-size:13px;margin:4px 0}.ishare{border-top:1px solid var(--line,#ddd);margin-top:10px;padding-top:10px}.ishare input{width:100%;font-size:13px;margin:4px 0}.ibtn{border:1px solid var(--line,#ccc);background:var(--card,#fff);color:inherit;border-radius:10px;padding:8px 14px;font:inherit;min-height:40px;margin:4px 6px 0 0;cursor:pointer}.ibtn.p{background:#0b5563;color:#fff;border-color:#0b5563}@media(min-width:700px){.imodal{align-items:center}}

<header><div class="hrow"><div><h1>泌尿科 科務入口</h1><div class="sub" id="sub"></div></div><div class="hside"><span class="sub" id="sync"></span><span id="inst"></span></div></div>
<nav class="tabs" id="tabs"></nav></header>
<main id="app"><p class="note">載入中…</p></main>
<script>
{
/* 同步：與刀房調度板共用同一個 Google Apps Script 儲存區
   共用資料鍵（給之後的小工具用）：
   common/people  人員名冊 {ts, people:[{id,n,full,role:'VS'|'R'|'F',lv,on,ts}]}
   common/links   常用連結 {items:[{n,u,d}]}
   common/handoff 黃部長交班單 {u:Google 文件網址, ts}（沒設定時用 HO_URL）
   ?action=cancerStatus 癌症討論會人數（Code.gs cancerStatus，不含病人資料）
   config/main    調度板設定（含 duty 值班、leaves 休假、vsLeaves 主治休假）
   days/YYYY-MM-DD 當日刀表與人力；er/list 急診刀清單 */
const SYNC_URL='https://script.google.com/macros/s/AKfycbyW-2Q_et8fXF4M45GVlxj8fJuCbRhTixBEg7UWA-xCku2AVWGCuvFE9M_W0WJoKayvAg/exec';
const LS={get(k){try{return JSON.parse(localStorage.getItem('or:'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('or:'+k,JSON.stringify(v))}catch(e){}}};
let gs=LS.get('gsync');if(!gs||!gs.url)gs=SYNC_URL?{url:SYNC_URL,token:'',on:true}:{url:'',token:'',on:false};
const on=()=>gs.on&&gs.url;
async function get(key){const r=await fetch(gs.url+(gs.url.includes('?')?'&':'?')+'key='+encodeURIComponent(key)+'&token='+encodeURIComponent(gs.token||''));const j=await r.json();if(!j.ok)throw new Error(j.err||'fail');return j.value}
/* 一次讀多個鍵（Code.gs ?keys=）；舊版 Apps Script 不支援時自動改回逐鍵讀取 */
async function getMany(keys){try{const r=await fetch(gs.url+(gs.url.includes('?')?'&':'?')+'keys='+encodeURIComponent(keys.join(','))+'&token='+encodeURIComponent(gs.token||''));const j=await r.json();
  if(j.ok&&j.value&&typeof j.value==='object'&&!Array.isArray(j.value))return keys.map(k=>({status:'fulfilled',value:j.value[k]??null}))}catch(e){}
 return Promise.allSettled(keys.map(get))}
async function set(key,value){const r=await fetch(gs.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:gs.token||'',key,value})});const j=await r.json();if(!j.ok)throw new Error(j.err||'fail')}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const DOW='日一二三四五六';const md=s=>`${+s.slice(5,7)}/${+s.slice(8)}（${DOW[new Date(s+'T00:00:00').getDay()]}）`;
const today=iso(new Date()),tmr=addD(today,1);
const ROLE={VS:'主治醫師',R:'住院醫師',F:'Fellow'};
const NOTION_URL='https://shengmin.notion.site/a40ece61b33441b8950284c54ab01f55';
const CANCER_URL='https://docs.google.com/spreadsheets/d/1OaCFv8mcIf8lKyyX__Tj_at4Y8KsX5q50r7F2F6riiI/edit';
/* 首頁「工具」：ext＝開新分頁；sub＝調度板分頁捷徑 */
const TOOLS=[
 {i:'🗓️',n:'刀房調度板',u:'./',d:'每日刀序、住院醫師人力、急診刀、術前準備、值班表',sub:[['import','📥 匯入刀表'],['plan','今日排程'],['er','急診刀'],['prep','術前準備'],['res','人力與能力']]},
 {i:'🕣',n:'晨會',u:'meeting.html',d:'重要公告與規定、重要會議日曆、未來晨會時程、紀錄與統計（獨立網站）'},
 {i:'📝',n:'黃部長交班',u:'#ho',d:'交班單（Google 文件），可直接在入口內檢視'},
 {i:'🎗️',n:'癌症討論會',u:'#cc',d:'下次討論會要挑的個案、討論後注意事項、統計（資料在 Google 試算表）'},
 {i:'📒',n:'Notion 科內筆記',u:NOTION_URL,d:'科內共筆、規範與教學資料',ext:1}];
const SOON=['科會事項追蹤','住院醫師排班'];
let S={people:null,links:null,cfg:null,dT:null,dM:null,er:null,err:'',loading:true},filt='cur',saving=0;
const isStand=()=>{try{return matchMedia('(display-mode: standalone)').matches||!!navigator.standalone}catch(e){return false}};
const page=()=>(location.hash||'#home').slice(1);

/* 載入：先用上次存在本機的資料立刻畫出來（hubcache），背景再一次向 Apps Script 取最新資料 */
const KEYS=()=>['common/people','common/links','config/main','days/'+today,'days/'+tmr,'er/list','common/handoff','meeting/drive','meeting/plan','feedback/list'];
function apply(m){const v=k=>m[k]===undefined?null:m[k];
 S.people=v('common/people');S.links=v('common/links');S.cfg=v('config/main')&&v('config/main').cfg;S.dT=v('days/'+today);S.dM=v('days/'+tmr);S.er=v('er/list');S.ho=v('common/handoff');S.md=v('meeting/drive');S.mp=v('meeting/plan');S.fb=v('feedback/list');
 if(!S.people&&S.cfg)S.people=seed(S.cfg)}
{const c=LS.get('hubcache');if(c&&c.m){apply(c.m);if(c.cc)S.cc=c.cc;S.loading=false;S.stale=true}}
async function load(){if(!S.stale)S.loading=true;render();if(!on()){S.loading=false;S.err='nosync';render();return}ccLoad();
 const k=KEYS(),r=await getMany(k),m={};k.forEach((x,i)=>{if(r[i].status==='fulfilled')m[x]=r[i].value});
 if(r.every(x=>x.status==='rejected')){S.err='conn';S.loading=false;render();return}S.err='';
 const old=LS.get('hubcache')||{};LS.set('hubcache',{ts:Date.now(),m,cc:old.cc});
 apply(m);{const DEF=[{n:'泌尿科指引更新',u:'https://urotrial-weekly-tw.shady-knoll-9572.chatgpt.site',d:'每週泌尿科指引與試驗更新'},{n:'癌症討論會試算表',u:CANCER_URL,d:'每週名單整理與統計'}];const L0=S.links||{items:[]};L0.items=L0.items||[];const seen=new Set(L0.done||[]);let add=0;for(const x of DEF)if(!seen.has(x.u)){if(!L0.items.some(y=>y.u===x.u)){L0.items.push(x);add++}seen.add(x.u)}L0.done=[...seen];S.links=L0;if(add||!(m['common/links']||{}).done){set('common/links',L0).catch(()=>{})}}
 S.loading=false;S.stale=false;render()}
function seed(c){const now=Date.now();return{ts:now,seeded:true,people:[...(c.res||[]).map(r=>({id:r.id,n:r.n,full:(String(r.alias||'').split(/[,，]/)[0]||'').trim(),role:r.lv==='Fellow'?'F':'R',lv:r.lv,on:!!r.on,ts:now})),...(c.sur||[]).map(x=>({id:'vs_'+x.n,n:x.n,full:x.n,role:'VS',lv:x.t||'主治醫師',on:true,ts:now}))]}}
const P=()=>(S.people&&S.people.people)||[];
const nm=id=>{const p=P().find(x=>x.id===id);if(p)return p.n;const r=((S.cfg||{}).res||[]).find(x=>x.id===id);return r?r.n:id};

function home(){if(S.err==='nosync')return setupCard();
 const c=S.cfg||{},L=(c.duty||{})[today]||[],g=r=>L.filter(x=>(String(x).split(':')[1]||'')===r).map(x=>nm(String(x).split(':')[0]));
 const lv=(c.leaves||[]).filter(l=>l.from<=today&&(l.to||l.from)>=today).map(l=>`${nm(l.r)}${l.type?'（'+l.type+(l.half&&l.half!=='all'?(l.half==='am'?'・上午':'・下午'):'')+'）':''}`);
 const vl=(c.vsLeaves||[]).filter(l=>l.from<=today&&(l.to||l.from)>=today).map(l=>esc(l.s));
 const day=(d,lab,ds)=>{const cs=(d&&d.cases||[]).filter(x=>!x.eve);const rooms=new Set(cs.map(x=>x.room).filter(r=>r!=='ESWL'));return `<a class="kpi" href="./#plan"><span>${lab} ${md(ds)}刀房</span><b>${cs.length?cs.length+' 台':'—'}</b><span>${cs.length?rooms.size+' 間房':'刀表未匯入'}</span></a>`};
 const er=((S.er&&S.er.items)||[]).filter(e=>!e.del&&(e.st||'wait')!=='done');const ct=t=>er.filter(e=>e.t===t).length;
 const duty=[['sec','二線'],['icu','ICU'],['w1','一線'],['tot','總值'],['','']].map(([k,v])=>g(k).length?(v?v+' ':'')+g(k).join('、'):'').filter(Boolean).map(esc).join('　');
 const tu=new Set(TOOLS.map(t=>t.u)),lk=((S.links&&S.links.items)||[]).filter(l=>l.u&&!tu.has(l.u));
 const tool=t=>{const tg=t.ext?'target="_blank" rel="noopener"':'';return `<div class="tool"><a class="go" href="${t.u}" ${tg}><b><span class="ic">${t.i}</span>${t.n}${t.ext?' <small class="note">↗</small>':''}</b><p>${t.d}</p></a>${t.sub?`<div class="row" style="gap:6px;margin-top:8px">${t.sub.map(([k,v])=>`<a class="btn s" style="text-decoration:none" href="${t.u}#${k}">${v}</a>`).join('')}</div>`:''}</div>`};
 return `<section><h2>① 今日總覽 <small>${md(today)}</small></h2><div class="kpis">${day(S.dT,'今天',today)}${day(S.dM,'明天',tmr)}
  ${(()=>{let d=today;for(let i=0;i<7&&new Date(d+'T00:00:00').getDay()!==2;i++)d=addD(d,1);const w=((S.md&&S.md.weeks)||[]).find(x=>x.d===d),n=(w?(w.outline||[]).length:0)+(((S.mp&&S.mp.items)||[]).filter(x=>!x.del&&x.d===d).length);return `<a class="kpi" href="meeting.html"><span>下次晨會 ${md(d)}</span><b>${n?n+' 項':'—'}</b><span>${w?'簡報已上傳':'還沒有簡報'}</span></a>`})()}${ccKpi()}<a class="kpi" href="./#er"><span>急診刀待處理</span><b>${er.length} 台</b><span>${er.length?`插刀 ${ct('insert')}・緊急 ${ct('urgent')}・一般急 ${ct('general')}`:'目前沒有'}</span></a></div>
  <div class="card" style="margin-top:10px"><dl class="dl">
   <dt>今晚值班</dt><dd>${duty||'<span class="note">值班表未匯入（在調度板「人力與能力」匯入）</span>'}</dd>
   <dt>住院醫師休假</dt><dd>${lv.length?esc(lv.join('、')):'<span class="note">無</span>'}</dd>
   <dt>主治休假</dt><dd>${vl.length?vl.join('、'):'<span class="note">無</span>'}</dd></dl></div></section>
 <section><h2>② 工具</h2><div class="grid">${TOOLS.map(tool).join('')}</div><p class="note" style="margin:8px 2px 0">規劃中：${SOON.join('・')}</p></section>
 <section><h2>③ 常用連結 <small><a href="#links">編輯</a></small></h2>${lk.length?`<div class="grid">${lk.map(l=>`<a class="tool" href="${esc(l.u)}" target="_blank" rel="noopener"><b>${esc(l.n)}</b><p>${esc(l.d||l.u)}</p></a>`).join('')}</div>`:'<p class="note">還沒有其他連結。可以在「常用連結」分頁加入醫院系統入口等。</p>'}</section>
 <p class="note" style="margin-top:-6px">目前版本 <b>v${CHANGELOG[0].v}</b>・${esc(CHANGELOG[0].t)}　<a href="#fb">💬 意見回饋・更新紀錄 →</a></p>`}

function people(){if(S.err==='nosync')return setupCard();const all=P();

 const cnt=r=>all.filter(p=>p.on!==false&&p.role===r).length;

 if(k==='fbadd'){const t=$('#fbText').value.trim();if(!t){fbMsg='請先寫下內容';render();return}const name=$('#fbName').value.trim(),cat=$('#fbCat').value;LS.set('fbname',name);const n=new Date(),pad=x=>String(x).padStart(2,'0');
  const f={id:'f'+Date.now().toString(36),name,cat,text:t,at:`${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}T${pad(n.getHours())}:${pad(n.getMinutes())}`,st:'new'};fbShow='open';fbDraft=t;fbSave(L=>L.push(f)).then(()=>{if(fbMsg==='已儲存'){fbDraft='';fbMsg='已送出，謝謝！';render()}})}
 if(k==='add'){const r=b.dataset.r;const p={id:'p'+Date.now().toString(36),n:'新成員',full:'',role:r,lv:r==='R'?'R1':r==='F'?'Fellow':'主治醫師',on:true,ts:Date.now()};savePeople(f=>f.people.push(p))}
 if(k==='ccv'){e.preventDefault();ccView=b.dataset.v;render();return}
 if(k==='ccre'){S.cc=null;render();ccLoad();return}
 if(k==='ccscan'){ccMsg='讀取 Drive 討論會資料夾中…（約半分鐘）';render();fetch(gs.url+(gs.url.includes('?')?'&':'?')+'action=cancerScan&token='+encodeURIComponent(gs.token||'')).then(r=>r.json()).then(j=>{ccMsg=j.ok?String(j.value):'更新失敗：'+(j.err||'');ccLoad()},()=>{ccMsg='更新失敗，請稍後再試';render()});return}
 if(k==='hoedit'){const f=$('#hoform');if(f)f.hidden=!f.hidden}
 if(k==='hosave'){const u=$('#hou').value.trim();if(!docId(u)){alert('請貼上 Google 文件網址（docs.google.com/document/d/…）');return}const v={u,ts:Date.now()};set('common/handoff',v).then(()=>{S.ho=v;render()},()=>{const m=$('#homsg');if(m)m.textContent='儲存失敗'})}
 if(k==='ladd'){S.links=S.links||{items:[]};S.links.items.push({n:'新連結',u:'',d:''});render();saveLinks()}
 if(k==='ldel'){S.links.items.splice(+b.dataset.i,1);render();saveLinks()}
 if(k==='conn'){const u=$('#u').value.trim();if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)){alert('網址應以 https://script.google.com/ 開頭');return}gs={url:u,token:$('#tk').value.trim(),on:true};LS.set('gsync',gs);load()}});
document.addEventListener('change',e=>{const el=e.target;const v=el.type==='checkbox'?el.checked:el.value.trim();
 if(el.dataset.ch==='pf'){const id=el.dataset.id,f=el.dataset.f;savePeople(R=>{const p=R.people.find(x=>x.id===id);if(!p)return;p[f]=v;if(f==='role')p.lv=v==='R'?'R1':v==='F'?'Fellow':'主治醫師';p.ts=Date.now()})}
 if(el.dataset.ch==='fbDone'||el.dataset.ch==='fbRe'){const id=el.dataset.id,f=el.dataset.ch==='fbDone';fbSave(L=>{const x=L.find(y=>y.id===id);if(x){if(f)x.st=v?'done':'new';else x.re=v}})}
 if(el.dataset.ch==='lf'){S.links.items[+el.dataset.i][el.dataset.f]=v;saveLinks()}});
addEventListener('hashchange',render);
load();setInterval(()=>{if(!document.hidden&&!saving&&page()==='home')load()},120000);
/* ===== 加到主畫面 ===== */
let bip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();bip=e});
try{if('serviceWorker' in navigator&&/^https:/.test(location.protocol)&&!/claude|googleusercontent/.test(location.host))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
const instLink=()=>location.origin+location.pathname.replace(/[^/]*$/,'')+'hub.html?openExternalBrowser=1';
function showInstall(){const ua=navigator.userAgent,inApp=/Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(ua),ios=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1),and=/Android/i.test(ua);
 const steps=inApp?`<p><b>你現在是在 LINE 裡面開啟的</b>，要先換到手機瀏覽器才能加到主畫面。</p><button class="ibtn p" data-iext>用 ${ios?'Safari':'Chrome'} 開啟</button><p class="inote">開啟後再按一次「📲 加到主畫面」。</p>`
  :ios?`<ol><li>點 Safari 下方（或上方）的<b>分享</b>按鈕 <span class="ik">⬆︎</span></li><li>往下滑，點<b>「加入主畫面」</b> <span class="ik">＋</span></li><li>右上角按<b>「新增」</b></li></ol><p class="inote">要用 Safari 開才有這個選項；Chrome 也可以從「分享」裡找到。</p>`
  :and?`<ol><li>點 Chrome 右上角 <span class="ik">⋮</span></li><li>點<b>「新增至主畫面」</b>或<b>「安裝應用程式」</b></li><li>按<b>「安裝」</b></li></ol>`
  :`<ol><li>Chrome／Edge：網址列右邊的 <span class="ik">⊕</span> 安裝圖示，或選單 →「安裝」</li><li>手機上用 Safari／Chrome 開這個網址，再按「📲 加到主畫面」</li></ol>`;
 const m=document.createElement('div');m.className='imodal';m.innerHTML=`<div class="ibox"><div class="ihead"><img src="hub-apple-touch-icon.png?v=2" alt="" width="48" height="48"><div><b>加到主畫面</b><div class="inote">之後點圖示就能直接打開，像 App 一樣</div></div></div>${steps}
 <div class="ishare"><b>分享給大家</b><p class="inote">把這個連結貼到 LINE 群組，大家點開會自動用手機瀏覽器開啟，再按「📲 加到主畫面」即可。</p><input readonly value="${instLink()}"><button class="ibtn" data-icopy>複製安裝連結</button></div><button class="ibtn" data-iclose>關閉</button></div>`;
 document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-iclose]'))m.remove();if(e.target.closest('[data-iext]'))location.href=instLink();if(e.target.closest('[data-icopy]')){const t='泌尿科 科務入口（點開後按「📲 加到主畫面」）\n'+instLink();const ip=m.querySelector('.ishare input');try{navigator.clipboard.writeText(t).then(()=>{e.target.textContent='已複製 ✓'},()=>{ip.select();document.execCommand('copy');e.target.textContent='已複製 ✓'})}catch(x){ip.select();document.execCommand('copy')}}})}
document.addEventListener('click',async e=>{const a=e.target.closest&&e.target.closest('[data-inst]');if(!a)return;e.preventDefault();e.stopPropagation();if(bip){bip.prompt();try{await bip.userChoice}catch(x){}bip=null;return}showInstall()},true);
}
</script>
